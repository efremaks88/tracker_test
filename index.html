          {f.airDate&&(
            <div style={{marginTop:8,background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.3)",
              borderRadius:6,padding:"6px 10px",fontSize:12,color:"#f59e0b"}}>
              📺 Эфир: {f.airDate}
            </div>
          )}
          <div style={{marginTop:20,background:"rgba(59,130,246,0.07)",border:"1px solid rgba(59,130,246,0.2)",
            borderRadius:6,padding:"10px 12px",fontSize:12,color:"#64748b"}}>
            <div style={{fontWeight:600,color:"#94a3b8",marginBottom:6}}>Авто-задачи при сохранении</div>
            {f.shootStart?<div style={{marginBottom:2}}>• Съёмки → {f.shootStart}</div>:null}
            {f.editStart?<div style={{marginBottom:2}}>• Монтаж (5 дней) → с {f.editStart}</div>:null}
            {f.preOtkDate?<div style={{marginBottom:2}}>• Пред-ОТК → {f.preOtkDate}</div>:null}
            {f.otkDate?<div style={{marginBottom:2}}>• Сдача ОТК → {f.otkDate}</div>:null}
            {!f.shootStart&&!f.editStart&&!f.preOtkDate&&!f.otkDate&&(
              <div style={{color:"#334155"}}>Заполните даты — задачи создадутся автоматически</div>
            )}
          </div>
        </div>
      </div>
      <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:20,
        borderTop:"1px solid #334155",paddingTop:16}}>
        <Btn variant="ghost" onClick={onClose}>Отмена</Btn>
        <Btn variant="primary" onClick={()=>{
          if(!f.name.trim()){alert("Введите название серии");return;}
          onSave(f);
        }}>{isNew?"Создать серию":"Сохранить"}</Btn>
      </div>
    </Modal>
  );
}

// ── КАЛЕНДАРЬ ────────────────────────────────────────────────────────
function CalendarView({data}){
  const today=new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  const [selectedDay,setSelectedDay]=useState(null);

  function prevMonth(){if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);}
  function nextMonth(){if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);}

  const firstDay=new Date(year,month,1);
  const startOffset=(firstDay.getDay()+6)%7;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);

  const seriesList=data.series||[];
  const allAirDates={};
  seriesList.forEach(ser=>{
    const proj=data.projects.find(p=>p.id===ser.projectId);
    if(!proj) return;
    generateSeriesAirDates(ser).forEach(d=>{
      if(!allAirDates[d]) allAirDates[d]=[];
      allAirDates[d].push({proj,ser});
    });
  });

  const milestones={};
  seriesList.forEach(ser=>{
    const proj=data.projects.find(p=>p.id===ser.projectId);
    if(!proj) return;
    if(ser.preOtkDate){
      if(!milestones[ser.preOtkDate]) milestones[ser.preOtkDate]=[];
      milestones[ser.preOtkDate].push({type:"preotk",proj,ser});
    }
    if(ser.otkDate){
      if(!milestones[ser.otkDate]) milestones[ser.otkDate]=[];
      milestones[ser.otkDate].push({type:"otk",proj,ser});
    }
  });


  function dayStr(d){
    if(!d) return null;
    return `${String(d).padStart(2,"0")}.${String(month+1).padStart(2,"0")}.${year}`;
  }

  const todayStr=formatDate(today);
  const selStr=selectedDay?dayStr(selectedDay):null;
  const selTasks=selStr?data.tasks.filter(t=>t.day===selStr):[];
  const selAirs=selStr?(allAirDates[selStr]||[]):[];
  const selMil=selStr?(milestones[selStr]||[]):[];

  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:20,alignItems:"start"}}>
      <div>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
          <Btn variant="ghost" onClick={prevMonth}>←</Btn>
          <span style={{fontSize:22,fontWeight:800,minWidth:200,textAlign:"center",color:"#f1f5f9"}}>
            {MONTHS[month]} {year}
          </span>
          <Btn variant="ghost" onClick={nextMonth}>→</Btn>
          <Btn variant="ghost" small onClick={()=>{setYear(today.getFullYear());setMonth(today.getMonth());}}>Сегодня</Btn>
          <input type="month"
            value={`${year}-${String(month+1).padStart(2,"0")}`}
            onChange={e=>{const[y,m]=e.target.value.split("-");if(y&&m){setYear(+y);setMonth(+m-1);}}}
            style={{background:"#0f172a",border:"1px solid #334155",color:"#e2e8f0",
              borderRadius:6,padding:"5px 8px",fontSize:12,cursor:"pointer"}}/>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:2}}>
          {["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(d=>(
            <div key={d} style={{textAlign:"center",fontSize:11,color:"#475569",padding:"4px 0"}}>{d}</div>
          ))}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
          {cells.map((d,i)=>{
            const ds=dayStr(d);
            const isToday=ds===todayStr;
            const isSel=d&&selectedDay===d;
            const dayTasks=ds?data.tasks.filter(t=>t.day===ds):[];
            const dayAirs=ds?(allAirDates[ds]||[]):[];
            const dayMil=ds?(milestones[ds]||[]):[];
            const projsWithTasks=[...new Set(dayTasks.map(t=>t.project))];
            return (
              <div key={i} onClick={()=>d&&setSelectedDay(isSel?null:d)}
                style={{minHeight:80,background:isSel?"#1e3a5f":isToday?"rgba(59,130,246,0.1)":"#1e293b",
                  border:`1px solid ${isSel?"#3b82f6":isToday?"rgba(59,130,246,0.4)":"#263352"}`,
                  borderRadius:6,padding:4,cursor:d?"pointer":"default",
                  opacity:d?1:0.2}}>
                {d&&(
                  <>
                    <div style={{fontSize:11,color:isToday?"#3b82f6":"#475569",fontWeight:isToday?700:400,marginBottom:3}}>
                      {d}
                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:2,marginBottom:2}}>
                      {projsWithTasks.map(pid=>{
                        const proj=data.projects.find(p=>p.id===pid);
                        return <div key={pid} title={proj?.name} style={{width:6,height:6,borderRadius:"50%",background:proj?.color||"#64748b"}}/>;
                      })}
                    </div>
                    {dayAirs.map(({proj,ser},i)=>(
                      <div key={proj.id+ser.id+i} style={{fontSize:9,color:"#f59e0b",background:"rgba(245,158,11,0.15)",
                        borderRadius:2,padding:"1px 3px",marginBottom:1,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>
                        📺 {proj.abbr||proj.name} {ser.name}
                      </div>
                    ))}
                    {dayMil.map((m,mi)=>(
                      <div key={mi} style={{fontSize:9,
                        color:m.type==="otk"?"#22c55e":"#3b82f6",
                        background:m.type==="otk"?"rgba(34,197,94,0.15)":"rgba(59,130,246,0.15)",
                        borderRadius:2,padding:"1px 3px",marginBottom:1,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>
                        {m.type==="otk"?"✓ОТК":"↑пОТК"} {m.proj.abbr||m.proj.name} {m.ser.name}
                      </div>
                    ))}
                    {dayTasks.length>0&&(
                      <div style={{fontSize:9,color:"#475569",marginTop:1}}>{dayTasks.length} смен</div>
                    )}
                  </>
                )}
              </div>
            );
          })}
        </div>

        <div style={{marginTop:12,display:"flex",gap:16,flexWrap:"wrap"}}>
          {data.projects.map(p=>(
            <div key={p.id} style={{display:"flex",alignItems:"center",gap:4}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:p.color}}/>
              <span style={{fontSize:10,color:"#475569"}}>{p.name}</span>
            </div>
          ))}
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <span style={{fontSize:10,color:"#f59e0b"}}>📺</span><span style={{fontSize:10,color:"#475569"}}>эфир</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <span style={{fontSize:10,color:"#22c55e"}}>✓ОТК</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <span style={{fontSize:10,color:"#3b82f6"}}>↑Пред-ОТК</span>
          </div>
        </div>
      </div>

      {selStr&&(
        <div style={{width:280,background:"#1e293b",border:"1px solid #334155",borderRadius:10,
          padding:"14px 16px",position:"sticky",top:0}}>
          <div style={{fontWeight:700,fontSize:14,color:"#93c5fd",marginBottom:12}}>
            {dayLabel(selStr)}
          </div>
          {selAirs.map(({proj,ser},i)=>(
            <div key={proj.id+ser.id+i} style={{background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.3)",
              borderRadius:6,padding:"6px 10px",marginBottom:6}}>
              <span style={{fontSize:11,color:"#f59e0b"}}>📺 Эфир: {proj.name} {ser.name}</span>
              {ser.airTime&&<span style={{fontSize:10,color:"#64748b",marginLeft:6}}>{ser.airTime}</span>}
            </div>
          ))}
          {selMil.map((m,i)=>(
            <div key={i} style={{background:m.type==="otk"?"rgba(34,197,94,0.1)":"rgba(59,130,246,0.1)",
              border:`1px solid ${m.type==="otk"?"rgba(34,197,94,0.3)":"rgba(59,130,246,0.3)"}`,
              borderRadius:6,padding:"6px 10px",marginBottom:6}}>
              <span style={{fontSize:11,color:m.type==="otk"?"#22c55e":"#3b82f6"}}>
                {m.type==="otk"?"✓ ОТК":"↑ Пред-ОТК"}: {m.proj.name} {m.ser.name}
              </span>
            </div>
          ))}
          {selTasks.length===0&&selAirs.length===0&&selMil.length===0&&(
            <div style={{color:"#334155",fontSize:12}}>Нет событий</div>
          )}
          {[...new Set(selTasks.map(t=>t.person))].map(person=>(
            <div key={person} style={{marginBottom:10}}>
              <div style={{fontSize:10,color:"#475569",letterSpacing:1,marginBottom:4}}>{person.toUpperCase()}</div>
              {selTasks.filter(t=>t.person===person).map(t=>(
                <TaskCard key={t.id} task={t} projects={data.projects}/>
              ))}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── ГАНТ ─────────────────────────────────────────────────────────────
function GanttView({data,onUpdate}){
  const {sorted:stages,stageMap,groupMap}=useContext(StagesCtx);
  const [weekOffset,setWeekOffset]=useState(0);
  const [taskModal,setTaskModal]=useState(null);
  const [expandedRows,setExpandedRows]=useState(new Set());
  const [compareMode,setCompareMode]=useState(false);
  const [pinnedRows,setPinnedRows]=useState(new Set());
  const dragRef=useRef(null);

  function toggleExpand(key){
    setExpandedRows(prev=>{const n=new Set(prev);n.has(key)?n.delete(key):n.add(key);return n;});
  }
  function togglePin(key){
    setPinnedRows(prev=>{const n=new Set(prev);n.has(key)?n.delete(key):n.add(key);return n;});
  }

  useEffect(()=>{
    function h(){setTaskModal({});}
    window.addEventListener("gantt-new-task",h);
    return ()=>window.removeEventListener("gantt-new-task",h);
  },[]);

  const refMonday=useMemo(()=>{
    const d=new Date(); const day=d.getDay()||7;
    d.setDate(d.getDate()-day+1+weekOffset*7);
    d.setHours(0,0,0,0); return d;
  },[weekOffset]);

  const days=useMemo(()=>{
    const arr=[];
    for(let i=0;i<28;i++){
      const d=new Date(refMonday); d.setDate(refMonday.getDate()+i);
      arr.push(formatDate(d));
    }
    return arr;
  },[refMonday]);

  const todayStr=formatDate(new Date());

  const rows=useMemo(()=>{
    const result=[];
    data.projects.filter(p=>p.status!=="архив").forEach(proj=>{
      const fromSeries=(data.series||[]).filter(s=>s.projectId===proj.id)
        .sort((a,b)=>(a.order||0)-(b.order||0)).map(s=>s.name);
      const fromTasks=[...new Set(data.tasks.filter(t=>t.project===proj.id).map(t=>t.series))]
        .filter(n=>!fromSeries.includes(n)).sort();
      [...fromSeries,...fromTasks].forEach(series=>{
        result.push({projId:proj.id,series,proj});
      });
    });
    return result;
  },[data]);

  function saveTask(task){
    let tasks;
    if(task._cascadeAll){
      const clean={...task}; delete clean._cascadeAll;
      tasks=task._cascadeAll.map(t=>t.id===clean.id?clean:t);
      if(!tasks.find(t=>t.id===clean.id)) tasks.push({...clean,id:genId(data.tasks)});
    } else {
      tasks=[...data.tasks];
      if(task.id&&tasks.find(t=>t.id===task.id)) tasks=tasks.map(t=>t.id===task.id?task:t);
      else tasks.push({...task,id:genId(data.tasks)});
    }
    // Снять manualStatus серии если новая задача выше по группе
    const savedTask=tasks.find(t=>t.id===(task.id||task))||task;
    const taskStage=stageMap[savedTask.status];
    const taskGroup=taskStage?.groupId?groupMap[taskStage.groupId]:null;
    let series=data.series||[];
    if(taskGroup){
      series=series.map(s=>{
        if(s.id!==savedTask.seriesId||!s.manualStatus) return s;
        const manualGroup=groupMap[s.manualStatus];
        if(manualGroup&&taskGroup.order>manualGroup.order) return {...s,manualStatus:undefined};
        return s;
      });
    }
    if(series!==data.series) onUpdate("series",series);
    onUpdate("tasks",tasks); setTaskModal(null);
  }
  function deleteTask(id){
    onUpdate("tasks",data.tasks.filter(t=>t.id!==id)); setTaskModal(null);
  }

  function handleDrop(e,row,d){
    e.preventDefault();
    const drag=dragRef.current; if(!drag) return;
    const {task,copy}=drag;
    dragRef.current=null;

    if(copy){
      const newTask={...task,id:genId(data.tasks),day:d,
        project:row.projId,series:row.series};
      delete newTask._cascadeAll;
      onUpdate("tasks",[...data.tasks,newTask]);
      return;
    }

    if(d===task.day&&row.projId===task.project&&row.series===task.series) return;

    const hasTail=data.tasks.some(t=>
      t.project===task.project&&t.series===task.series&&t.day>task.day&&t.id!==task.id);

    const diff=(parseDate(d)-parseDate(task.day))/(1000*60*60*24);

    const applyMove=(cascade)=>{
      let tasks=data.tasks.map(t=>{
        if(t.id===task.id) return {...t,day:d,project:row.projId,series:row.series};
        if(cascade&&t.project===task.project&&t.series===task.series&&t.day>task.day)
          return {...t,day:addDays(t.day,diff)};
        return t;
      });
      onUpdate("tasks",tasks);
    };

    if(hasTail&&diff!==0){
      const ok=window.confirm("Сдвинуть весь хвост серии?");
      applyMove(ok);
    } else {
      applyMove(false);
    }
  }

  const COL=52;

  const monthSpans=useMemo(()=>{
    const spans=[];
    days.forEach(d=>{
      const pd=parseDate(d);
      const mk=`${pd.getFullYear()}-${pd.getMonth()}`;
      if(!spans.length||spans[spans.length-1].key!==mk)
        spans.push({key:mk,label:MONTHS[pd.getMonth()],count:1});
      else spans[spans.length-1].count++;
    });
    return spans;
  },[days]);

  return (
    <div>
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:16,flexWrap:"wrap"}}>
        <Btn variant="ghost" onClick={()=>setWeekOffset(w=>w-1)}>← Пред. неделя</Btn>
        <Btn variant="ghost" small onClick={()=>setWeekOffset(0)}>Сегодня</Btn>
        <Btn variant="ghost" onClick={()=>setWeekOffset(w=>w+1)}>След. неделя →</Btn>
        <div style={{flex:1}}/>
        <Btn variant={compareMode?"primary":"ghost"} small
          onClick={()=>{setCompareMode(m=>!m);setPinnedRows(new Set());}}>
          {compareMode?`Сравнение (${pinnedRows.size})  ×`:"⊞ Сравнить серии"}
        </Btn>
        <Btn variant="primary" onClick={()=>setTaskModal({})}>+ Задача</Btn>
      </div>

      <div style={{overflow:"auto",maxHeight:"calc(100vh - 220px)",border:"1px solid #1e293b",borderRadius:8}}>
        <div style={{minWidth:200+COL*28}}>
          {/* Шапка — sticky top */}
          <div style={{position:"sticky",top:0,zIndex:12}}>
            {/* Строка месяцев */}
            <div style={{display:"flex"}}>
              <div style={{width:200,flexShrink:0,height:18,position:"sticky",left:0,zIndex:21,
                background:"#060d1a",borderBottom:"1px solid #0f172a",borderRight:"1px solid #334155"}}/>
              {monthSpans.map((span,si)=>(
                <div key={span.key} style={{width:COL*span.count,flexShrink:0,height:18,
                  display:"flex",alignItems:"center",paddingLeft:6,
                  background:"#060d1a",
                  borderLeft:si===0?"none":"2px solid #334155",
                  borderBottom:"1px solid #0f172a"}}>
                  <span style={{fontSize:9,color:"#475569",letterSpacing:1,textTransform:"uppercase"}}>
                    {span.label}
                  </span>
                </div>
              ))}
            </div>
            {/* Строка дней */}
            <div style={{display:"flex"}}>
              <div style={{width:200,flexShrink:0,height:44,position:"sticky",left:0,zIndex:20,
                background:"#0f172a",borderBottom:"1px solid #334155",borderRight:"1px solid #334155"}}/>
              {days.map(d=>{
                const pd=parseDate(d);
                const isToday=d===todayStr;
                const isMon=pd&&pd.getDay()===1;
                const isSun=pd&&pd.getDay()===0;
                return (
                  <div key={d} style={{width:COL,flexShrink:0,display:"flex",flexDirection:"column",
                    alignItems:"center",justifyContent:"center",height:44,
                    background:isToday?"rgba(59,130,246,0.2)":isSun||isMon?"#1e293b":"#0f172a",
                    borderLeft:isMon?"2px solid #334155":"1px solid #1e293b",
                    borderBottom:"1px solid #334155"}}>
                    <span style={{fontSize:9,color:"#475569"}}>{WDAYS[pd?.getDay()||0]}</span>
                    <span style={{fontSize:11,fontWeight:isToday?700:400,color:isToday?"#60a5fa":"#64748b"}}>
                      {pd?pd.getDate():""}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Строки */}
          {(compareMode&&pinnedRows.size>0?rows.filter(r=>pinnedRows.has(`${r.projId}|${r.series}`)):rows).map((row,ri)=>{
            const rowKey=`${row.projId}|${row.series}`;
            const isExpanded=expandedRows.has(rowKey);
            const isPinned=pinnedRows.has(rowKey);
            const seriesTasks=data.tasks.filter(t=>t.project===row.projId&&t.series===row.series);
            const subPeople=[...new Set(seriesTasks.map(t=>t.person).filter(Boolean))].sort();
            return (
            <React.Fragment key={ri}>
            <div style={{display:"flex",height:52,background:ri%2===0?"#0a1220":"#060d1a"}}>
              {/* Метка строки — sticky left */}
              <div style={{width:200,flexShrink:0,position:"sticky",left:0,zIndex:5,
                display:"flex",alignItems:"center",padding:"0 6px 0 10px",
                borderBottom:"1px solid #1e293b",borderRight:"1px solid #334155",
                background:ri%2===0?"#0f172a":"#0a1220"}}>
                {compareMode&&(
                  <input type="checkbox" checked={isPinned} onChange={()=>togglePin(rowKey)}
                    style={{marginRight:6,accentColor:"#3b82f6",flexShrink:0}}/>
                )}
                <div style={{width:8,height:8,borderRadius:2,background:row.proj.color,flexShrink:0,marginRight:6}}/>
                <div style={{overflow:"hidden",flex:1,cursor:"pointer"}}
                  onDoubleClick={()=>toggleExpand(rowKey)}
                  title="Двойной клик — развернуть/свернуть">
                  <div style={{fontSize:10,color:"#475569",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                    {row.proj.name}
                  </div>
                  <div style={{fontSize:12,fontWeight:600,color:"#cbd5e1",display:"flex",alignItems:"center",gap:4}}>
                    {row.series}
                    <span style={{fontSize:9,color:isExpanded?"#3b82f6":"#334155"}}>{isExpanded?"▲":"▼"}</span>
                  </div>
                </div>
              </div>

              {/* Ячейки дней */}
              {days.map(d=>{
                const cellTasks=data.tasks.filter(t=>
                  t.project===row.projId&&t.series===row.series&&t.day===d);
                const isToday=d===todayStr;
                const pd=parseDate(d);
                const isMon=pd&&pd.getDay()===1;
                return (
                  <div key={d}
                    onClick={()=>setTaskModal({project:row.projId,series:row.series,day:d})}
                    onDragOver={e=>{e.preventDefault();
                      e.dataTransfer.dropEffect=dragRef.current?.copy?"copy":"move";}}
                    onDrop={e=>handleDrop(e,row,d)}
                    style={{width:COL,flexShrink:0,borderLeft:isMon?"2px solid #334155":"1px solid #1e293b",
                      padding:2,display:"flex",flexDirection:"column",gap:1,cursor:"pointer",
                      background:isToday?"rgba(59,130,246,0.06)":"transparent",
                      transition:"background 0.1s"}}
                    onMouseEnter={e=>e.currentTarget.style.background=isToday?"rgba(59,130,246,0.12)":"rgba(255,255,255,0.03)"}
                    onMouseLeave={e=>e.currentTarget.style.background=isToday?"rgba(59,130,246,0.06)":"transparent"}>
                    {cellTasks.map(t=>{
                      const st=stageMap[t.status];
                      return (
                        <div key={t.id}
                          draggable
                          onDragStart={e=>{
                            e.stopPropagation();
                            dragRef.current={task:t,copy:e.altKey};
                            e.dataTransfer.effectAllowed=e.altKey?"copy":"move";
                          }}
                          onClick={e=>{e.stopPropagation();setTaskModal(t);}}
                          title={`${t.person} ${t.from}:00–${t.to}:00 ${t.note||""}\n[Alt+перетащить = копировать]`}
                          style={{background:st?colorToBg(st.color):"rgba(255,255,255,0.08)",
                            border:`1px solid ${st?st.color+"44":"#334155"}`,
                            borderRadius:3,padding:"1px 3px",fontSize:9,
                            color:st?st.color:"#94a3b8",overflow:"hidden",
                            whiteSpace:"nowrap",textOverflow:"ellipsis",
                            cursor:"grab",userSelect:"none"}}>
                          {t.unplanned&&"⚠"}{st?.label||t.status} {t.person}
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
            {isExpanded&&subPeople.map((person,pi)=>(
              <div key={person} style={{display:"flex",height:36,background:"rgba(59,130,246,0.04)",
                borderBottom:"1px solid #0f172a"}}>
                <div style={{width:200,flexShrink:0,position:"sticky",left:0,zIndex:5,
                  display:"flex",alignItems:"center",padding:"0 10px 0 28px",
                  borderRight:"1px solid #334155",background:"rgba(15,23,42,0.95)"}}>
                  <div style={{width:4,height:4,borderRadius:"50%",background:"#3b82f6",marginRight:6,flexShrink:0}}/>
                  <span style={{fontSize:11,color:"#94a3b8",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>
                    {person}
                  </span>
                </div>
                {days.map(d=>{
                  const pt=seriesTasks.filter(t=>t.person===person&&t.day===d);
                  const isToday=d===todayStr;
                  return (
                    <div key={d} style={{width:COL,flexShrink:0,padding:1,
                      borderLeft:"1px solid #1e293b",
                      background:isToday?"rgba(59,130,246,0.06)":"transparent",
                      display:"flex",flexDirection:"column",gap:1}}>
                      {pt.map(t=>{
                        const st=stageMap[t.status];
                        return (
                          <div key={t.id} onClick={e=>{e.stopPropagation();setTaskModal(t);}}
                            style={{background:st?colorToBg(st.color):"rgba(255,255,255,0.08)",
                              border:`1px solid ${st?st.color+"44":"#334155"}`,
                              borderRadius:3,padding:"1px 3px",fontSize:8,
                              color:st?st.color:"#94a3b8",overflow:"hidden",
                              whiteSpace:"nowrap",textOverflow:"ellipsis",cursor:"pointer"}}>
                            {st?.abbr||st?.label||t.status} {t.from}–{t.to}
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            ))}
            </React.Fragment>
          );})}
        </div>
      </div>

      {taskModal!==null&&(
        <TaskModal task={taskModal} data={data}
          onSave={saveTask} onDelete={deleteTask} onClose={()=>setTaskModal(null)}/>
      )}
    </div>
  );
}

function TaskModal({task,data,onSave,onDelete,onClose}){
  const {sorted:stages,stageMap}=useContext(StagesCtx);
  const isNew=!task.id;
  const [form,setForm]=useState({
    project:task.project||"",series:task.series||"",status:task.status||"",
    person:task.person||"",day:task.day||"",from:task.from||10,to:task.to||19,
    note:task.note||"",unplanned:task.unplanned||false,shifts_tail:false,
  });
  const sf=v=>setForm(f=>({...f,...v}));

  const isLocked=useMemo(()=>{
    if(!task.id||!task.day) return false;
    const td=parseDate(task.day); if(!td) return false;
    const now=new Date(); now.setHours(0,0,0,0);
    return (now-td)/(1000*60*60*24)>7;
  },[task]);

  const stageInfo=form.status?stageMap[form.status]:null;
  const needsExecutor=!stageInfo||stageInfo.needsExecutor!==false;

  const availSeries=useMemo(()=>{
    const fromSeries=(data.series||[]).filter(s=>s.projectId===form.project)
      .sort((a,b)=>(a.order||0)-(b.order||0)).map(s=>s.name);
    const fromTasks=[...new Set(data.tasks.filter(t=>t.project===form.project).map(t=>t.series))]
      .filter(n=>!fromSeries.includes(n)).sort();
    return [...fromSeries,...fromTasks];
  },[form.project,data]);

  const availPeople=useMemo(()=>{
    if(!form.status) return data.people.filter(p=>p.active!==false);
    return filterPeopleByStatus(data.people,form.status,stages);
  },[form.status,data.people,stages]);

  const roleHint=useMemo(()=>{
    const roles=stageInfo?.rolesRequired||[];
    if(!roles.length) return "";
    const labels=roles.map(r=>data.roles.find(rl=>rl.id===r)?.label||r);
    return `Показаны: ${labels.join(", ")}`;
  },[stageInfo,data.roles]);

  const hasTail=useMemo(()=>{
    if(!task.id||!task.day||form.day===task.day) return false;
    return data.tasks.some(t=>t.project===task.project&&t.series===task.series&&t.day>task.day&&t.id!==task.id);
  },[form.day,task,data.tasks]);

  return (
    <Modal title={isNew?"Новая задача":"Редактировать задачу"} onClose={onClose} locked>
      {isLocked&&(
        <div style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.35)",
          borderRadius:6,padding:"10px 14px",marginBottom:12,fontSize:13,color:"#f87171",
          display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:16}}>🔒</span>
          <span>Задача старше 7 дней — редактирование и удаление заблокированы</span>
        </div>
      )}
      <Field label="Проект">
        <SelSearch value={form.project} onChange={v=>sf({project:v,series:"",person:""})}
          options={data.projects.map(p=>({value:p.id,label:p.name}))} placeholder="Выбрать проект..." autoFocus/>
      </Field>
      <Field label="Серия">
        <SelSearch value={form.series} onChange={v=>sf({series:v})}
          options={availSeries} placeholder="Выбрать или ввести: С01..." allowCustom/>
      </Field>
      <Field label="Этап">
        <SelSearch value={form.status} onChange={v=>sf({status:v,person:""})}
          options={stages.map(s=>({value:s.id,label:s.label}))} placeholder="Выбрать этап..."/>
      </Field>
      <Field label={`Исполнитель${needsExecutor?"":" (необязательно)"}`} hint={roleHint}>
        <SelSearch value={form.person} onChange={v=>sf({person:v})}
          options={availPeople.map(p=>({value:p.name,label:p.name+(p.roles.length?" ("+p.roles.map(r=>data.roles.find(rl=>rl.id===r)?.label||r).join(", ")+")":"")}))}
          placeholder={needsExecutor?"Выбрать исполнителя...":"Без исполнителя..."} allowCustom/>
      </Field>
      <Field label="Дата">
        <InpDate value={form.day} onChange={v=>sf({day:v})}/>
      </Field>
      <Field label="Время">
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
          {TIME_PRESETS.map(({f:fr,t:to})=>(
            <Btn key={`${fr}-${to}`} small
              variant={form.from===fr&&form.to===to?"primary":"ghost"}
              onClick={()=>sf({from:fr,to})}>
              {fr}–{to}
            </Btn>
          ))}
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <span style={{fontSize:12,color:"#64748b"}}>с</span>
          <Inp value={String(form.from)} onChange={v=>sf({from:parseInt(v)||0})}
            type="number" min="0" max="24" style={{width:60}}/>
          <span style={{fontSize:12,color:"#64748b"}}>до</span>
          <Inp value={String(form.to)} onChange={v=>sf({to:parseInt(v)||0})}
            type="number" min="0" max="24" style={{width:60}}/>
          <span style={{fontSize:12,color:"#64748b"}}>{form.to-form.from>0?`${form.to-form.from}ч`:""}</span>
        </div>
      </Field>
      <Field label="Заметка">
        <textarea value={form.note} onChange={e=>sf({note:e.target.value})} rows={2}
          placeholder="Описание, факт выполнения..."
          style={{background:"#0f172a",border:"1px solid #334155",color:"#e2e8f0",
            borderRadius:6,padding:"7px 10px",fontSize:13,width:"100%",resize:"vertical"}}/>
      </Field>
      <div style={{display:"flex",gap:16,marginBottom:6}}>
        {hasTail&&(
          <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
            <input type="checkbox" checked={form.shifts_tail}
              onChange={e=>sf({shifts_tail:e.target.checked})} style={{accentColor:"#f59e0b"}}/>
            <span style={{fontSize:13,color:"#f59e0b"}}>Сдвинуть весь хвост серии</span>
          </label>
        )}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:16}}>
        <div>{!isNew&&<Btn variant="danger" disabled={isLocked} onClick={()=>!isLocked&&onDelete(task.id)}>Удалить</Btn>}</div>
        <div style={{display:"flex",gap:8}}>
          <Btn variant="ghost" onClick={onClose}>Отмена</Btn>
          <Btn variant="primary" disabled={isLocked} onClick={()=>{
            if(isLocked) return;
            if(!form.project){alert("Выберите проект");return;}
            if(!form.series){alert("Укажите серию");return;}
            if(!form.status){alert("Выберите этап");return;}
            if(!form.day){alert("Укажите дату");return;}
            const ser=(data.series||[]).find(s=>s.projectId===form.project&&s.name===form.series);
            const seriesId=ser?ser.id:(task.seriesId||null);
            const saved={...task,...form,seriesId,autogenerated:task.autogenerated||false};
            if(form.shifts_tail&&task.id&&form.day!==task.day){
              const diff=(parseDate(form.day)-parseDate(task.day))/(1000*60*60*24);
              const tailTasks=data.tasks.filter(t=>t.project===task.project&&t.series===task.series&&t.day>task.day&&t.id!==task.id);
              const updatedTail=tailTasks.map(t=>({...t,day:addDays(t.day,diff)}));
              const allTasks=data.tasks.map(t=>{
                const upd=updatedTail.find(u=>u.id===t.id);
                return upd||t;
              });
              onSave({...saved,_cascadeAll:allTasks});
            } else {
              onSave(saved);
            }
          }}>
            {isNew?"Создать задачу":"Сохранить"}
          </Btn>
        </div>
      </div>
    </Modal>
  );
}

// ── ПО ДНЯМ ──────────────────────────────────────────────────────────
function DaysView({data,conflictIds}){
  const [groupBy,setGroupBy]=useState("day");
  const [filterPerson,setFilterPerson]=useState("");
  const [filterProject,setFilterProject]=useState("");
  const tasks=useMemo(()=>enrichTasks(data.tasks),[data.tasks]);
  const people=useMemo(()=>[...new Set(tasks.map(t=>t.person))].sort(),[tasks]);
  const containerRef=useRef(null);

  useEffect(()=>{
    const h=e=>{if(e.key==="Escape"){setFilterPerson("");setFilterProject("");}};
    document.addEventListener("keydown",h);
    return()=>document.removeEventListener("keydown",h);
  },[]);

  const filtered=useMemo(()=>{
    let r=tasks;
    if(filterPerson) r=r.filter(t=>t.person===filterPerson);
    if(filterProject) r=r.filter(t=>t.project===filterProject);
    return r;
  },[tasks,filterPerson,filterProject]);

  const peopleCols=filterPerson?[filterPerson]:people;

  function scrollToToday(){
    if(!containerRef.current) return;
    const today=formatDate(new Date());
    const el=containerRef.current.querySelector(`[data-day="${today}"]`);
    if(el) el.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  }

  function DayCol({dayKey,dayTasks,compact}){
    const hasC=dayTasks.some(t=>conflictIds.has(t.id));
    return (
      <div data-day={dayKey}>
        <div style={{padding:compact?"4px 6px":"7px 10px",
          background:hasC?"rgba(239,68,68,0.12)":"#1e293b",
          borderRadius:"6px 6px 0 0",borderBottom:`2px solid ${hasC?"#ef4444":"#3b82f6"}`,
          fontSize:compact?10:11,fontWeight:700,color:hasC?"#f87171":"#93c5fd",
          display:"flex",justifyContent:"space-between"}}>
          <span>{dayLabel(dayKey)}</span>{hasC&&<span>⚡</span>}
        </div>
        <div style={{background:"#1e293b",borderRadius:"0 0 6px 6px",border:"1px solid #334155",
          borderTop:"none",padding:compact?4:6,minHeight:compact?50:80}}>
          {peopleCols.map(person=>{
            const pt=dayTasks.filter(t=>t.person===person);
            if(!pt.length) return null;
            return (
              <div key={person} style={{marginBottom:compact?4:6}}>
                <div style={{fontSize:compact?8:9,color:"#475569",letterSpacing:1,marginBottom:2}}>{person.toUpperCase()}</div>
                {pt.map(t=><TaskCard key={t.id} task={t} projects={data.projects} isConflict={conflictIds.has(t.id)}/>)}
              </div>
            );
          })}
          {!dayTasks.length&&<div style={{color:"#334155",fontSize:11}}>нет задач</div>}
        </div>
      </div>
    );
  }

  const dayKeys=[...new Set(filtered.map(t=>t._dayKey))].sort((a,b)=>daySort(a).localeCompare(daySort(b)));
  const groups={};
  if(groupBy!=="day") filtered.forEach(t=>{
    const k=groupBy==="week"?t._weekKey:t._monthKey;
    if(!groups[k]) groups[k]=[];
    groups[k].push(t);
  });

  return (
    <div>
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
        {["все",...people].map(p=>(
          <button key={p} onClick={()=>setFilterPerson(p==="все"?"":p)}
            style={{padding:"3px 12px",borderRadius:16,border:"1px solid",cursor:"pointer",fontSize:11,
              borderColor:(!filterPerson&&p==="все")||(filterPerson===p)?"#3b82f6":"#334155",
              background:(!filterPerson&&p==="все")||(filterPerson===p)?"rgba(59,130,246,0.2)":"transparent",
              color:(!filterPerson&&p==="все")||(filterPerson===p)?"#93c5fd":"#64748b"}}>
            {p}
          </button>
        ))}
        <span style={{color:"#263352",margin:"0 4px"}}>│</span>
        {["все проекты",...data.projects.map(p=>p.id)].map(pid=>{
          const proj=data.projects.find(p=>p.id===pid);
          const label=proj?proj.name:"все проекты";
          const active=pid==="все проекты"?!filterProject:filterProject===pid;
          return (
            <button key={pid} onClick={()=>setFilterProject(pid==="все проекты"?"":pid)}
              style={{padding:"3px 12px",borderRadius:16,border:"1px solid",cursor:"pointer",fontSize:11,
                borderColor:active?(proj?.color||"#3b82f6"):"#334155",
                background:active?`${proj?.color||"#3b82f6"}22`:"transparent",
                color:active?(proj?.color||"#93c5fd"):"#64748b"}}>
              {label}
            </button>
          );
        })}
        <span style={{color:"#263352",margin:"0 4px"}}>│</span>
        {[["day","Дни"],["week","Недели"],["month","Месяцы"]].map(([v,l])=>(
          <button key={v} onClick={()=>setGroupBy(v)}
            style={{padding:"3px 10px",borderRadius:4,border:"1px solid",cursor:"pointer",fontSize:10,
              borderColor:groupBy===v?"#475569":"#263352",background:groupBy===v?"#334155":"transparent",
              color:groupBy===v?"#cbd5e1":"#475569"}}>{l}</button>
        ))}
        <Btn small variant="ghost" onClick={scrollToToday}>→ Сегодня</Btn>
      </div>

      <div ref={containerRef}>
        {groupBy==="day"?(
          <div style={{display:"grid",gridTemplateColumns:`repeat(${Math.min(dayKeys.length,7)},1fr)`,gap:8}}>
            {dayKeys.map(dk=><DayCol key={dk} dayKey={dk} dayTasks={filtered.filter(t=>t._dayKey===dk)}/>)}
          </div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:20}}>
            {Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).map(([gk,gTasks])=>{
              const sample=gTasks[0];
              const title=groupBy==="week"?`Неделя ${weekLabel(sample.day)}`:`${MONTHS[parseInt(gk.split("-")[1])-1]} ${gk.split("-")[0]}`;
              const dks=[...new Set(gTasks.map(t=>t._dayKey))].sort((a,b)=>daySort(a).localeCompare(daySort(b)));
              return (
                <div key={gk}>
                  <div style={{fontSize:13,fontWeight:700,color:"#93c5fd",marginBottom:8,
                    paddingBottom:6,borderBottom:"1px solid #1e293b",display:"flex",justifyContent:"space-between"}}>
                    <span>{title}</span>
                    <span style={{fontWeight:400,fontSize:11,color:"#475569"}}>{gTasks.length} смен</span>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:`repeat(${Math.min(dks.length,7)},1fr)`,gap:6}}>
                    {dks.map(dk=><DayCol key={dk} dayKey={dk} dayTasks={gTasks.filter(t=>t._dayKey===dk)} compact/>)}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ── ПО ЛЮДЯМ ─────────────────────────────────────────────────────────
function PeopleView({data,conflictIds}){
  const [selPeople,setSelPeople]=useState([]);
  const [filterProject,setFilterProject]=useState("");
  const [groupBy,setGroupBy]=useState("day");
  const tasks=useMemo(()=>enrichTasks(data.tasks),[data.tasks]);
  const people=useMemo(()=>[...new Set(tasks.map(t=>t.person))].sort(),[tasks]);
  const containerRef=useRef(null);

  useEffect(()=>{
    const h=(e)=>{if(e.key==="Escape") setSelPeople([]);};
    document.addEventListener("keydown",h);
    return ()=>document.removeEventListener("keydown",h);
  },[]);

  function togglePerson(name){
    setSelPeople(prev=>prev.includes(name)?prev.filter(p=>p!==name):[...prev,name]);
  }

  const baseTasks=useMemo(()=>{
    let r=tasks;
    if(filterProject) r=r.filter(t=>t.project===filterProject);
    return r;
  },[tasks,filterProject]);

  const showPeople=selPeople.length?selPeople:people;

  function scrollToToday(){
    if(!containerRef.current) return;
    const today=formatDate(new Date());
    const el=containerRef.current.querySelector(`[data-day="${today}"]`);
    if(el) el.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  }

  return (
    <div>
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
        <button onClick={()=>setSelPeople([])}
          style={{padding:"3px 12px",borderRadius:16,border:"1px solid",cursor:"pointer",fontSize:11,
            borderColor:selPeople.length===0?"#3b82f6":"#334155",
            background:selPeople.length===0?"rgba(59,130,246,0.2)":"transparent",
            color:selPeople.length===0?"#93c5fd":"#64748b"}}>
          все
        </button>
        {people.map(p=>{
          const active=selPeople.includes(p);
          const hasConflict=tasks.some(t=>t.person===p&&conflictIds.has(t.id));
          return (
            <button key={p} onClick={()=>togglePerson(p)}
              style={{padding:"3px 12px",borderRadius:16,border:"1px solid",cursor:"pointer",fontSize:11,
                borderColor:active?"#3b82f6":"#334155",
                background:active?"rgba(59,130,246,0.2)":"transparent",
                color:active?"#93c5fd":"#64748b"}}>
              {p}{hasConflict&&<span style={{width:5,height:5,borderRadius:"50%",background:"#ef4444",display:"inline-block",marginLeft:4}}/>}
            </button>
          );
        })}
        <span style={{color:"#263352",margin:"0 4px"}}>│</span>
        {[["day","Дни"],["week","Нед"],["month","Мес"]].map(([v,l])=>(
          <button key={v} onClick={()=>setGroupBy(v)}
            style={{padding:"3px 10px",borderRadius:4,border:"1px solid",cursor:"pointer",fontSize:10,
              borderColor:groupBy===v?"#475569":"#263352",background:groupBy===v?"#334155":"transparent",
              color:groupBy===v?"#cbd5e1":"#475569"}}>{l}</button>
        ))}
        <Btn small variant="ghost" onClick={scrollToToday}>→ Сегодня</Btn>
        {selPeople.length>0&&<span style={{fontSize:11,color:"#475569"}}>ESC — снять выделение</span>}
      </div>

      <div ref={containerRef} style={{display:"flex",flexDirection:"column",gap:20}}>
        {showPeople.map(person=>{
          const pTasks=baseTasks.filter(t=>t.person===person);
          if(!pTasks.length) return null;
          const cDays=[...new Set(pTasks.filter(t=>conflictIds.has(t.id)).map(t=>t._dayKey))];
          const groups={};
          pTasks.forEach(t=>{
            const k=groupBy==="week"?t._weekKey:groupBy==="month"?t._monthKey:t._dayKey;
            if(!groups[k]) groups[k]=[];
            groups[k].push(t);
          });
          return (
            <div key={person}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <div style={{width:32,height:32,borderRadius:"50%",background:"#1e293b",
                  border:"2px solid #3b82f6",display:"flex",alignItems:"center",
                  justifyContent:"center",fontSize:13,fontWeight:700,color:"#3b82f6"}}>
                  {person[0]}
                </div>
                <span style={{fontSize:15,fontWeight:700}}>{person}</span>
                {cDays.length>0&&(
                  <span style={{background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.4)",
                    borderRadius:12,padding:"2px 10px",fontSize:11,color:"#f87171"}}>
                    ⚡ конфликты: {cDays.map(d=>dayLabel(d)).join(", ")}
                  </span>
                )}
              </div>
              <div style={{display:"grid",
                gridTemplateColumns:`repeat(${Math.min(Object.keys(groups).length,7)},1fr)`,gap:6}}>
                {Object.entries(groups).sort(([a],[b])=>daySort(a).localeCompare(daySort(b))).map(([gk,gtasks])=>{
                  const hasC=gtasks.some(t=>conflictIds.has(t.id));
                  const label=groupBy==="day"?dayLabel(gk):groupBy==="week"?`Нед ${weekLabel(gtasks[0].day)}`:`${MONTHS[parseInt(gk.split("-")[1])-1]}`;
                  return (
                    <div key={gk} data-day={groupBy==="day"?gk:undefined}
                      style={{background:hasC?"rgba(239,68,68,0.05)":"#1e293b",
                        border:`1px solid ${hasC?"rgba(239,68,68,0.35)":"#334155"}`,
                        borderRadius:8,padding:"8px 10px",minHeight:60}}>
                      <div style={{fontSize:9,color:hasC?"#f87171":"#475569",marginBottom:5,letterSpacing:0.5}}>
                        {label}{hasC&&" ⚡"}
                      </div>
                      {gtasks.map(t=><TaskCard key={t.id} task={t} projects={data.projects} isConflict={conflictIds.has(t.id)}/>)}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── КОНФЛИКТЫ ────────────────────────────────────────────────────────
function ConflictsView({details,data}){
  const today=new Date(); today.setHours(0,0,0,0);
  const todayStr=formatDate(today);
  const in7=new Date(today); in7.setDate(today.getDate()+7);
  const in7Str=formatDate(in7);

  const unfilledTasks=useMemo(()=>
    data.tasks.filter(t=>!t.person&&t.day>=todayStr&&t.day<=in7Str&&t.status!=="съёмки")
      .sort((a,b)=>daySort(a.day).localeCompare(daySort(b.day))||a.status.localeCompare(b.status)),

function computeShifts(tasks, people){
  // Суммируем часы по person+day, потом применяем правило 6ч
  const byPersonDay={};
  tasks.forEach(t=>{
    if(!t.person) return;
    const key=t.person+"|"+t.day;
    byPersonDay[key]=(byPersonDay[key]||0)+(Number(t.to)||0)-(Number(t.from)||0);
  });
  // Теперь по каждому person считаем выходы и смены
  const byPerson={};
  Object.entries(byPersonDay).forEach(([key,hours])=>{
    const [person]=key.split("|");
    if(!byPerson[person]) byPerson[person]={person,exits:0,shifts:0};
    byPerson[person].exits+=1;
    byPerson[person].shifts+=(hours>6?1:0.5);
  });
  return Object.values(byPerson).map(r=>{
    const p=people.find(p=>p.name===r.person);
    const role=(p&&p.roles&&p.roles[0])||"";
    return {...r,role};
  }).sort((a,b)=>a.role.localeCompare(b.role)||a.person.localeCompare(b.person));
}

function DayShiftsModal({data,onClose}){
  const {stageMap}=useContext(StagesCtx);
  const tomorrow=new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  const [targetDay,setTargetDay]=useState(formatDate(tomorrow));
  const [copied,setCopied]=useState(false);

  const shifts=useMemo(()=>{
    const tasks=data.tasks.filter(t=>t.day===targetDay&&t.person)
      .sort((a,b)=>a.from-b.from);
    const byPerson={};
    tasks.forEach(t=>{
      if(!byPerson[t.person]) byPerson[t.person]=[];
      byPerson[t.person].push(t);
    });
    return Object.entries(byPerson).sort(([a],[b])=>a.localeCompare(b))
      .map(([person,tasks])=>({person,tasks}));
  },[data.tasks,targetDay]);

  const pd=parseDate(targetDay);
  const dateLabel=pd?`${WDAYS_LONG[pd.getDay()]}, ${targetDay}`:"—";

  function buildText(){
    let s=`📋 Смены — ${dateLabel}\n${"─".repeat(32)}\n\n`;
    if(!shifts.length){s+="Смен нет\n";return s;}
    shifts.forEach(({person,tasks})=>{
      const totalH=tasks.reduce((acc,t)=>(Number(t.to)||0)-(Number(t.from)||0)+acc,0);
      s+=`👤 ${person}  (${totalH}ч)\n`;
      tasks.forEach(t=>{
        const proj=data.projects.find(p=>p.id===t.project);
        const st=stageMap[t.status];
        s+=`   • ${proj?.name||t.project}  ${t.series}  ·  ${st?.label||t.status}  ·  ${t.from}:00–${t.to}:00`;
        if(t.note) s+=`  — ${t.note}`;
        s+="\n";
      });
      s+="\n";
    });
    return s;
  }

  function copyText(){
    navigator.clipboard.writeText(buildText()).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  }

  return (
    <Modal title="Смены на день" onClose={onClose} wide>
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:20}}>
        <InpDate value={targetDay} onChange={setTargetDay}/>
        <span style={{fontSize:13,color:"#64748b"}}>{pd?WDAYS_LONG[pd.getDay()]:""}</span>
        <div style={{flex:1}}/>
        <Btn variant="ghost" small onClick={copyText}>{copied?"✓ Скопировано":"📋 Копировать текст"}</Btn>
        <Btn variant="ghost" small onClick={()=>window.print()}>🖨 Печать</Btn>
      </div>

      {shifts.length===0?(
        <div style={{textAlign:"center",padding:"40px 0",color:"#475569",fontSize:14}}>
          На этот день смен нет
        </div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          {shifts.map(({person,tasks})=>{
            const totalH=tasks.reduce((acc,t)=>(Number(t.to)||0)-(Number(t.from)||0)+acc,0);
            const pInfo=data.people.find(p=>p.name===person);
            const roleId=pInfo?.roles?.[0];
            const role=roleId?data.roles.find(r=>r.id===roleId):null;
            return (
              <div key={person} style={{background:"#0f172a",border:"1px solid #334155",borderRadius:8,overflow:"hidden"}}>
                <div style={{padding:"10px 16px",background:"#1e293b",display:"flex",alignItems:"center",gap:10,
                  borderBottom:"1px solid #334155"}}>
                  <div style={{width:34,height:34,borderRadius:"50%",
                    background:`${role?.color||"#3b82f6"}22`,border:`2px solid ${role?.color||"#3b82f6"}`,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:14,fontWeight:800,color:role?.color||"#3b82f6"}}>
                    {person[0]}
                  </div>
                  <div>
                    <div style={{fontWeight:700,fontSize:14}}>{person}</div>
                    {role&&<div style={{fontSize:11,color:role.color}}>{role.label}</div>}
                  </div>
                  <div style={{marginLeft:"auto",fontSize:12,color:"#64748b"}}>
                    {totalH} ч · {tasks.length} {tasks.length===1?"задача":tasks.length<=4?"задачи":"задач"}
                  </div>
                </div>
                {tasks.map((t,ti)=>{
                  const proj=data.projects.find(p=>p.id===t.project);
                  const st=stageMap[t.status];
                  return (
                    <div key={t.id} style={{padding:"10px 16px",
                      borderBottom:ti<tasks.length-1?"1px solid #1e293b":"none",
                      display:"flex",gap:12,alignItems:"center"}}>
                      <div style={{width:3,alignSelf:"stretch",borderRadius:2,
                        background:proj?.color||"#334155",flexShrink:0}}/>
                      <div style={{flex:1}}>
                        <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:3}}>
                          <span style={{fontWeight:600,fontSize:13}}>{proj?.name||t.project}</span>
                          <span style={{fontSize:11,color:"#475569"}}>· {t.series}</span>
                          {st&&<span style={{fontSize:10,background:`${st.color}22`,color:st.color,
                            border:`1px solid ${st.color}44`,borderRadius:4,padding:"1px 7px",fontWeight:600}}>
                            {st.abbr||st.label}
                          </span>}
                        </div>
                        {t.note&&<div style={{fontSize:11,color:"#64748b",marginTop:2}}>{t.note}</div>}
                      </div>
                      <div style={{fontSize:13,fontWeight:700,color:"#94a3b8",flexShrink:0}}>
                        {t.from}:00–{t.to}:00
                        <span style={{fontSize:10,color:"#475569",marginLeft:4}}>
                          ({(Number(t.to)||0)-(Number(t.from)||0)}ч)
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}
    </Modal>
  );
}

                id:proj.id+"-"+name.toLowerCase().replace(/\s/g,"_"),

                editStart:proj.edit_start||"",preOtkDate:proj.pre_otk||"",
                otkDate:proj.otk||"",airDate:"",
                airMode:proj.air_mode||"weekly",airDay:proj.air_weekday||1,airTime:proj.air_time||"21:00",
              });
            });
          });
          migrated=true;
        }
        if((record.tasks||[]).some(t=>t.seriesId===undefined)){
          record.tasks=(record.tasks||[]).map(t=>{
            if(t.seriesId!==undefined) return t;
            const ser=(record.series||[]).find(s=>s.projectId===t.project&&s.name===t.series);
            return{...t,seriesId:ser?ser.id:null,autogenerated:t.autogenerated||false};
          });
          migrated=true;
        }
        setData(record);
        if(migrated) return cloudSave(record);
      })
      .then(()=>setSyncState("ok"))
      .catch(()=>{
        setData(makeDemoData());
        setSyncState("error");
      });
  },[]);

  const histRef=useRef([]);
  const viewRef=useRef(view);
  viewRef.current=view;

  function pushHistory(prev){
    histRef.current=[...histRef.current.slice(-30),prev];
  }
  function doSave(d){
    clearTimeout(saveTimer.current);
    setSyncState("saving");
    saveTimer.current=setTimeout(()=>{
      cloudSave(d).then(()=>setSyncState("ok")).catch(()=>setSyncState("error"));
    },1000);
  }
  function undo(){
    if(!histRef.current.length) return;
    const prev=histRef.current[histRef.current.length-1];
    histRef.current=histRef.current.slice(0,-1);
    setData(prev);
    doSave(prev);
  }

  useEffect(()=>{
    function handle(e){
      const ctrl=e.ctrlKey||e.metaKey;
      if(ctrl&&(e.key==="z"||e.code==="KeyZ")&&!e.shiftKey){e.preventDefault();undo();}
      if(e.altKey&&(e.code==="KeyN")&&viewRef.current==="gantt"){
        e.preventDefault();
        window.dispatchEvent(new CustomEvent("gantt-new-task"));
      }
    }
    document.addEventListener("keydown",handle);
    return ()=>document.removeEventListener("keydown",handle);
  },[]);

  function updateData(key,val){
    setData(d=>{
      pushHistory(d);
      const newData={...d,[key]:val};
      doSave(newData);
      return newData;
    });
  }

  function deleteProject(projId){
    if(!window.confirm("Удалить проект? Прошлые задачи сохранятся в истории.")) return;
    const today=formatDate(new Date());
    setData(d=>{
      pushHistory(d);
      const newData={
        ...d,
        projects:d.projects.filter(p=>p.id!==projId),
        series:(d.series||[]).filter(s=>s.projectId!==projId),
        tasks:d.tasks.filter(t=>t.project!==projId||t.day<today),
      };
      doSave(newData);
      return newData;
    });
  }

  function batchUpdate(changes){
    setData(d=>{
      pushHistory(d);
      const newData={...d,...changes};
      doSave(newData);
      return newData;
    });
  }

  const stagesCtxVal=useMemo(()=>{
    const stagesArr=(data?.stages&&data.stages.length)?data.stages:DEFAULT_STAGES;
    const sorted=[...stagesArr].sort((a,b)=>(a.order||0)-(b.order||0));
    const stageMap=Object.fromEntries(stagesArr.map(s=>[s.id,s]));
    const stageGroups=(data?.stageGroups&&data.stageGroups.length)?data.stageGroups:DEFAULT_STAGE_GROUPS;
    const groupMap=Object.fromEntries(stageGroups.map(g=>[g.id,g]));
    return {stageMap,sorted,stageGroups,groupMap};
  },[data?.stages,data?.stageGroups]);

  const holidaysCtxVal=useMemo(()=>data?.holidays||DEFAULT_HOLIDAYS,[data?.holidays]);

  const {ids:conflictIds,details:conflictDetails}=useMemo(()=>{
    if(!data) return {ids:new Set(),details:[]};
    const todayStr=formatDate(new Date());
    return getConflicts(data.tasks.filter(t=>t.day>=todayStr));
  },[data?.tasks]);
  const conflictCount=conflictDetails.length;

  if(!data) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#475569"}}>
      Загрузка...
    </div>
  );

  const TABS=[
    {id:"projects", label:"Проекты"},
    {id:"calendar", label:"Календарь"},
    {id:"gantt",    label:"Гант"},
    {id:"days",     label:"По дням"},
    {id:"people",   label:"По людям"},
    {id:"conflicts",  label:`Конфликты${conflictCount?` ⚡${conflictCount}`:""}`,warn:conflictCount>0},
    {id:"analytics",  label:"Аналитика"},
    {id:"directory",  label:"⚙ Настройки"},
  ];

  return (
    <StagesCtx.Provider value={stagesCtxVal}>
    <HolidaysCtx.Provider value={holidaysCtxVal}>
    <div style={{background:"#0f172a",minHeight:"100vh",color:"#e2e8f0"}}>
      <div style={{background:"#1e293b",borderBottom:"1px solid #334155",padding:"12px 20px",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div>
            <div className="bbx-title" style={{fontSize:22,fontWeight:800,letterSpacing:1}}>
              ББХ · Постпродакшн
            </div>
            <div style={{fontSize:12,color:"#475569",marginTop:2}}>Планирование студии</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {{ok:    <span style={{fontSize:11,color:"#22c55e"}}>✓ Сохранено</span>,
              saving:<span style={{fontSize:11,color:"#f59e0b"}}>⟳ Сохранение...</span>,
              error: <span style={{fontSize:11,color:"#ef4444"}}>⚠ Нет связи</span>,
            }[syncState]}
            <Btn variant="ghost" small onClick={()=>setDayShiftsModal(true)}>📋 Смены на день</Btn>
            <Btn variant="ghost" small onClick={()=>data&&exportJSON(data)}>↓ Экспорт</Btn>
          </div>
        </div>
        <div style={{display:"flex",gap:1,background:"#0f172a",borderRadius:8,border:"1px solid #334155",
          overflow:"hidden",width:"fit-content"}}>
          {TABS.map(({id,label,warn})=>(
            <button key={id} onClick={()=>setView(id)} style={{
              padding:"6px 14px",border:"none",borderRight:"1px solid #334155",cursor:"pointer",
              fontSize:12,fontFamily:"inherit",
              background:view===id?"#3b82f6":"transparent",
              color:warn?(view===id?"#fff":"#f87171"):(view===id?"#fff":"#64748b"),
              fontWeight:view===id?700:400}}>
              {label}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:"20px"}}>
        {view==="projects" &&<ProjectsView  data={data} onUpdate={updateData} onBatchUpdate={batchUpdate} onDeleteProject={deleteProject}/>}
        {view==="calendar" &&<CalendarView  data={data}/>}
        {view==="gantt"    &&<GanttView     data={data} onUpdate={updateData}/>}
        {view==="days"     &&<DaysView      data={data} conflictIds={conflictIds}/>}
        {view==="people"   &&<PeopleView    data={data} conflictIds={conflictIds}/>}
        {view==="conflicts" &&<ConflictsView details={conflictDetails} data={data}/>}
        {view==="analytics" &&<AnalyticsView data={data}/>}
        {view==="directory" &&<DirectoryView data={data} onUpdate={updateData}/>}

        {!["conflicts","analytics","directory"].includes(view)&&(
          <div style={{marginTop:24,paddingTop:14,borderTop:"1px solid #1e293b",
            display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
            <span style={{fontSize:10,color:"#334155",letterSpacing:2,marginRight:2}}>ГРУППЫ:</span>
            {stagesCtxVal.stageGroups.map(g=>{
              const repStage=stagesCtxVal.sorted.find(s=>s.groupId===g.id);
              const c=repStage?.color||"#475569";
              return (
                <span key={g.id} style={{fontSize:10,background:`${c}22`,color:c,
                  border:`1px solid ${c}44`,borderRadius:4,padding:"1px 8px",fontWeight:600}}>
                  {g.label}
                </span>
              );
            })}
            <span style={{fontSize:11,color:"#f87171",marginLeft:6}}>⚡ = конфликт</span>
          </div>
        )}
      </div>
    </div>
    {dayShiftsModal&&<DayShiftsModal data={data} onClose={()=>setDayShiftsModal(false)}/>}
    </HolidaysCtx.Provider>
    </StagesCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
