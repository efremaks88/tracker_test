function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",").map(h=>h.trim().toLowerCase());
  return lines.slice(1).map((line,idx)=>{
    const cols=[]; let cur="", inQ=false;
    for(const ch of line){
      if(ch==='"') inQ=!inQ;
      else if(ch===',' && !inQ){cols.push(cur.trim());cur="";}
      else cur+=ch;
    }
    cols.push(cur.trim());
    const obj={_id:idx};
    headers.forEach((h,i)=>{obj[h]=(cols[i]||"").replace(/^"|"$/g,"").trim();});
    return obj;
  }).filter(r=>r["проект"]&&r["серия"]&&r["кто"]);
}

function nsStatus(s){

// ── УТИЛИТЫ ──────────────────────────────────────────────────────────
function parseDate(str){
  if(!str) return null;
  const m=str.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(!m) return null;
  return new Date(+m[3],+m[2]-1,+m[1]);
}
function formatDate(d){
  if(!d) return "";
  const dd=String(d.getDate()).padStart(2,"0");
  const mm=String(d.getMonth()+1).padStart(2,"0");
  return `${dd}.${mm}.${d.getFullYear()}`;
}
function toInput(dmy){
  if(!dmy) return "";
  const m=dmy.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  return m?`${m[3]}-${m[2]}-${m[1]}`:"";
}
function fromInput(ymd){
  if(!ymd) return "";
  const [y,mo,d]=ymd.split("-");
  return `${d}.${mo}.${y}`;
}
function dayLabel(str){
  const d=parseDate(str); if(!d) return str;
  return `${WDAYS[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}`;
}
function weekKey(str){
  const d=parseDate(str); if(!d) return str;
  const day=d.getDay()||7;
  const mon=new Date(d); mon.setDate(d.getDate()-day+1);
  return mon.toISOString().slice(0,10);
}
function weekLabel(str){
  const d=parseDate(str); if(!d) return str;
  const day=d.getDay()||7;
  const mon=new Date(d); mon.setDate(d.getDate()-day+1);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const fmt=dt=>`${String(dt.getDate()).padStart(2,"0")}.${String(dt.getMonth()+1).padStart(2,"0")}`;
  return `${fmt(mon)} – ${fmt(sun)}`;
}
function monthKey(str){
  const d=parseDate(str); if(!d) return str;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function addDays(str,n){
  const d=parseDate(str); if(!d) return str;
  d.setDate(d.getDate()+n);
  return formatDate(d);
}
function generateAirDates(proj){
  if(proj.air_mode==="custom") return proj.air_dates||[];
  if(proj.air_mode!=="weekly") return [];
  const start=parseDate(proj.edit_start);
  const end=parseDate(proj.otk);
  if(!start||!end) return [];
  const jsDay=(proj.air_weekday||1)%7;
  const d=new Date(start);
  while(d.getDay()!==jsDay) d.setDate(d.getDate()+1);
  const dates=[];
  while(d<=end){dates.push(formatDate(d));d.setDate(d.getDate()+7);}
  return dates;
}
function filterPeopleByStatus(people,status){
  const roles=STATUS_ROLES[status];
  if(!roles||!roles.length) return people.filter(p=>p.active!==false);
  return people.filter(p=>p.active!==false&&p.roles.some(r=>roles.includes(r)));
}
function getConflicts(tasks){
  const ids=new Set(); const details=[];
  const byPD={};
  tasks.forEach(t=>{
    const k=t.person+"||"+t.day;
    if(!byPD[k]) byPD[k]=[];
    byPD[k].push(t);
  });
  Object.values(byPD).forEach(group=>{
    for(let i=0;i<group.length;i++) for(let j=i+1;j<group.length;j++){
      const a=group[i],b=group[j];
      const af=a.from||0,at=a.to||0,bf=b.from||0,bt=b.to||0;
      if(af<bt&&bf<at){
        ids.add(a.id);ids.add(b.id);
        const key=[a.id,b.id].sort().join("-");
        if(!details.find(d=>d.key===key))
          details.push({key,person:a.person,dayStr:a.day,taskA:a,taskB:b,
            overlapFrom:Math.max(af,bf),overlapTo:Math.min(at,bt)});
      }
    }
  });
  return {ids,details};
}
function enrichTasks(tasks){
  return tasks.map(t=>({...t,
    _dayKey: t.day,
    _weekKey:weekKey(t.day),
    _monthKey:monthKey(t.day),
  }));
}
function projColor(projects,projId){
  return (projects.find(p=>p.id===projId)||{}).color||"#3b82f6";
}
function projName(projects,projId){
  return (projects.find(p=>p.id===projId)||{}).name||projId;
}

    onUpdate("projects",data.projects.filter(p=>p.id!==id)); setModal(null);
  }

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <span style={{fontSize:16,fontWeight:700}}>Проекты ({data.projects.length})</span>
        <Btn variant="primary" onClick={()=>setModal({name:"",description:"",color:PALETTE[0],
          status:"в работе",manager:"",series:[],
          shoot_start:"",shoot_end:"",edit_start:"",edit_end:"",
          pre_otk:"",otk:"",air_mode:"weekly",air_weekday:1,air_time:"21:00",air_dates:[]})}>
          + Новый проект
        </Btn>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:20}}>
        {data.projects.map(proj=>{
          const pTasks=data.tasks.filter(t=>t.project===proj.id);
          const seriesList=proj.series&&proj.series.length?proj.series:[...new Set(pTasks.map(t=>t.series))].sort();
          const airDates=generateAirDates(proj);
          const isExpanded=expanded===proj.id;
          const managerPerson=data.people.find(p=>p.name===proj.manager);
          const statusColors={"в работе":"#3b82f6","на паузе":"#f59e0b","сдан":"#22c55e"};
          return (
            <div key={proj.id} style={{background:"#1e293b",border:`1px solid ${proj.color}44`,
              borderTop:`3px solid ${proj.color}`,borderRadius:10}}>
              {/* Шапка карточки */}
              <div style={{padding:"14px 18px",display:"flex",alignItems:"flex-start",gap:12}}>
                <div style={{width:12,height:12,borderRadius:"50%",background:proj.color,
                  flexShrink:0,marginTop:4,boxShadow:`0 0 8px ${proj.color}`}}/>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
                    <span style={{fontSize:17,fontWeight:700}}>{proj.name}</span>
                    <span style={{fontSize:11,background:`${statusColors[proj.status]||"#64748b"}22`,
                      color:statusColors[proj.status]||"#64748b",
                      border:`1px solid ${statusColors[proj.status]||"#64748b"}44`,
                      borderRadius:4,padding:"1px 8px"}}>{proj.status}</span>
                  </div>
                  {proj.description&&<div style={{fontSize:12,color:"#64748b",marginBottom:8}}>{proj.description}</div>}
                  {/* Даты в одну строку */}
                  <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
                    {proj.edit_start&&<div style={{fontSize:11,color:"#475569"}}>
                      <span style={{color:"#334155"}}>Монтаж: </span>{proj.edit_start} – {proj.edit_end||"…"}</div>}
                    {proj.pre_otk&&<div style={{fontSize:11,color:"#475569"}}>
                      <span style={{color:"#334155"}}>Пред-ОТК: </span>
                      <span style={{color:"#3b82f6"}}>{proj.pre_otk}</span></div>}
                    {proj.otk&&<div style={{fontSize:11,color:"#475569"}}>
                      <span style={{color:"#334155"}}>ОТК: </span>
                      <span style={{color:"#22c55e"}}>{proj.otk}</span></div>}
                    {airDates.length>0&&<div style={{fontSize:11,color:"#475569"}}>
                      <span style={{color:"#334155"}}>Эфиров: </span>
                      <span style={{color:"#f59e0b"}}>{airDates.length}</span></div>}
                    {proj.manager&&<div style={{fontSize:11,color:"#475569"}}>
                      <span style={{color:"#334155"}}>Менеджер: </span>{proj.manager}</div>}
                  </div>
                </div>
                <div style={{display:"flex",gap:6,flexShrink:0}}>
                  <Btn small variant="ghost" onClick={()=>setExpanded(isExpanded?null:proj.id)}>
                    {isExpanded?"Свернуть":"Подробно"}
                  </Btn>
                  <Btn small variant="ghost" onClick={()=>setModal(proj)}>Изм</Btn>
                </div>
              </div>

              {/* Серии */}
              <div style={{padding:"0 18px 14px",display:"grid",
                gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:8}}>
                {seriesList.map(series=>{
                  const sTasks=pTasks.filter(t=>t.series===series);
                  const maxOrder=Math.max(...sTasks.map(t=>STATUS_ORDER.indexOf(t.status)).filter(x=>x>=0),-1);
                  const curStatus=maxOrder>=0?STATUS_ORDER[maxOrder]:sTasks[0]?.status||"";
                  const st=STATUSES[curStatus];
                  const workers=[...new Set(sTasks.map(t=>t.person))];
                  return (
                    <div key={series} style={{background:"#0f172a",
                      borderTop:`2px solid ${st?st.color:proj.color}`,borderRadius:6,padding:"10px 12px"}}>
                      <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>{series}</div>
                      <StatusBadge s={curStatus}/>
                      {workers.length>0&&(
                        <div style={{marginTop:6,display:"flex",gap:3,flexWrap:"wrap"}}>
                          {workers.map(w=><span key={w} style={{fontSize:9,background:"rgba(255,255,255,0.05)",
                            border:"1px solid #334155",borderRadius:3,padding:"1px 5px",color:"#64748b"}}>{w}</span>)}
                        </div>
                      )}
                      {/* Прогресс */}
                      <div style={{display:"flex",gap:1,marginTop:8}}>
                        {STATUS_ORDER.map(s2=>{
                          const i2=STATUS_ORDER.indexOf(s2),ci=STATUS_ORDER.indexOf(curStatus);
                          const sc=STATUSES[s2];
                          return <div key={s2} title={sc?.label} style={{flex:1,height:3,borderRadius:1,
                            background:s2===curStatus?(sc?.color||proj.color):i2<ci?"#334155":"#1e293b"}}/>;
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Расширенный вид — эфиры и даты */}
              {isExpanded&&(
                <div style={{borderTop:"1px solid #334155",padding:"14px 18px",
                  display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
                  <div>
                    <div style={{fontSize:11,color:"#64748b",letterSpacing:1,marginBottom:8}}>ДАТЫ</div>
                    {[["Съёмки",proj.shoot_start,proj.shoot_end],
                      ["Монтаж",proj.edit_start,proj.edit_end]].map(([label,s,e])=>s&&(
                      <div key={label} style={{fontSize:12,color:"#94a3b8",marginBottom:4}}>
                        <span style={{color:"#475569"}}>{label}: </span>{s} – {e||"…"}
                      </div>
                    ))}
                    {proj.pre_otk&&<div style={{fontSize:12,color:"#3b82f6",marginBottom:4}}>Пред-ОТК: {proj.pre_otk}</div>}
                    {proj.otk&&<div style={{fontSize:12,color:"#22c55e"}}>ОТК: {proj.otk}</div>}
                  </div>
                  <div>
                    <div style={{fontSize:11,color:"#64748b",letterSpacing:1,marginBottom:8}}>
                      ЭФИРЫ ({proj.air_mode==="weekly"?"еженедельно":"даты вручную"})
                    </div>
                    {proj.air_mode==="weekly"&&<div style={{fontSize:12,color:"#94a3b8",marginBottom:6}}>
                      Каждый {WDAYS_LONG[proj.air_weekday%7]||"понедельник"} в {proj.air_time}
                    </div>}
                    <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                      {airDates.slice(0,12).map(d=>(
                        <span key={d} style={{fontSize:10,background:"rgba(245,158,11,0.15)",
                          color:"#f59e0b",border:"1px solid rgba(245,158,11,0.3)",
                          borderRadius:4,padding:"2px 6px"}}>📺 {d}</span>
                      ))}
                      {airDates.length>12&&<span style={{fontSize:10,color:"#475569"}}>+{airDates.length-12} ещё</span>}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {modal&&<ProjectModal project={modal} data={data}
        onSave={saveProject} onDelete={deleteProject} onClose={()=>setModal(null)}/>}
    </div>
  );
}

function ProjectModal({project,data,onSave,onDelete,onClose}){
  const [form,setForm]=useState({...project});
  const [newSeries,setNewSeries]=useState("");
  const [newAirDate,setNewAirDate]=useState("");
  const isNew=!project.id;
  const f=form; const sf=v=>setForm(p=>({...p,...v}));
  const managers=data.people.filter(p=>p.active!==false&&p.roles.some(r=>["выпуск","продюсер"].includes(r)));

  return (
    <Modal title={isNew?"Новый проект":"Редактировать проект"} onClose={onClose} wide>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        {/* Левая колонка */}
        <div>
          <Field label="Название"><Inp value={f.name} onChange={v=>sf({name:v})} placeholder="Название проекта"/></Field>
          <Field label="Описание">
            <textarea value={f.description||""} onChange={e=>sf({description:e.target.value})}
              placeholder="Краткое описание..."
              style={{background:"#0f172a",border:"1px solid #334155",color:"#e2e8f0",
                borderRadius:6,padding:"7px 10px",fontSize:13,width:"100%",resize:"vertical",minHeight:60}}/>
          </Field>
          <Field label="Цвет проекта">
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {PALETTE.map(c=>(
                <div key={c} onClick={()=>sf({color:c})} style={{width:24,height:24,borderRadius:4,
                  background:c,cursor:"pointer",border:f.color===c?"2px solid #fff":"2px solid transparent",
                  boxShadow:f.color===c?`0 0 8px ${c}`:"none"}}/>
              ))}
            </div>
          </Field>
          <Field label="Статус"><Sel value={f.status} onChange={v=>sf({status:v})} options={PROJECT_STATUSES}/></Field>
          <Field label="Менеджер / Продюсер">
            <Sel value={f.manager} onChange={v=>sf({manager:v})}
              options={managers.map(p=>({value:p.name,label:p.name}))}
              placeholder="Выбрать..."/>
          </Field>
          <Field label="Серии">
            <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:6}}>
              {(f.series||[]).map(s=>(
                <span key={s} style={{background:"rgba(255,255,255,0.07)",border:"1px solid #334155",
                  borderRadius:4,padding:"2px 8px",fontSize:12,display:"flex",alignItems:"center",gap:4}}>
                  {s}
                  <button onClick={()=>sf({series:f.series.filter(x=>x!==s)})}
                    style={{background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:14,lineHeight:1}}>×</button>
                </span>
              ))}
            </div>
            <div style={{display:"flex",gap:6}}>
              <Inp value={newSeries} onChange={setNewSeries} placeholder="С01" style={{width:80}}/>
              <Btn variant="ghost" onClick={()=>{
                if(!newSeries.trim()) return;
                sf({series:[...(f.series||[]),newSeries.trim()]});setNewSeries("");
              }}>+ Добавить</Btn>
            </div>
          </Field>
        </div>

        {/* Правая колонка */}
        <div>
          <div style={{fontSize:11,color:"#64748b",letterSpacing:1,marginBottom:10}}>ДАТЫ</div>
          <Field label="Съёмки — начало"><InpDate value={f.shoot_start} onChange={v=>sf({shoot_start:v})}/></Field>
          <Field label="Съёмки — конец"><InpDate value={f.shoot_end} onChange={v=>sf({shoot_end:v})}/></Field>
          <Field label="Монтаж — старт"><InpDate value={f.edit_start} onChange={v=>sf({edit_start:v})}/></Field>
          <Field label="Монтаж — финиш"><InpDate value={f.edit_end} onChange={v=>sf({edit_end:v})}/></Field>
          <Field label="Дата Пред-ОТК"><InpDate value={f.pre_otk} onChange={v=>sf({pre_otk:v})}/></Field>
          <Field label="Дата ОТК (сдача каналу)"><InpDate value={f.otk} onChange={v=>sf({otk:v})}/></Field>

          <div style={{fontSize:11,color:"#64748b",letterSpacing:1,margin:"16px 0 10px"}}>ЭФИРЫ</div>
          <Field label="Режим">
            <div style={{display:"flex",gap:8}}>
              {[["weekly","Каждую неделю"],["custom","Другой график"]].map(([v,l])=>(
                <label key={v} style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",
                  background:f.air_mode===v?"rgba(59,130,246,0.15)":"transparent",
                  border:`1px solid ${f.air_mode===v?"#3b82f6":"#334155"}`,
                  borderRadius:6,padding:"5px 10px"}}>
                  <input type="radio" name="air_mode" value={v} checked={f.air_mode===v}
                    onChange={()=>sf({air_mode:v})}/>
                  <span style={{fontSize:12}}>{l}</span>
                </label>
              ))}
            </div>
          </Field>
          {f.air_mode==="weekly"&&(
            <>
              <Field label="День недели">
                <Sel value={String(f.air_weekday||1)} onChange={v=>sf({air_weekday:parseInt(v)})}
                  options={[1,2,3,4,5,6,7].map(n=>({value:String(n),label:WDAYS_LONG[n%7]}))}/>
              </Field>
              <Field label="Время эфира">
                <Inp value={f.air_time||""} onChange={v=>sf({air_time:v})} placeholder="21:00"/>
              </Field>
            </>
          )}
          {f.air_mode==="custom"&&(
            <Field label="Даты эфиров">
              <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>
                {(f.air_dates||[]).map(d=>(
                  <span key={d} style={{background:"rgba(245,158,11,0.15)",color:"#f59e0b",
                    border:"1px solid rgba(245,158,11,0.3)",borderRadius:4,padding:"2px 8px",
                    fontSize:11,display:"flex",alignItems:"center",gap:4}}>
                    📺 {d}
                    <button onClick={()=>sf({air_dates:(f.air_dates||[]).filter(x=>x!==d)})}
                      style={{background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:14,lineHeight:1}}>×</button>
                  </span>
                ))}
              </div>
              <div style={{display:"flex",gap:6}}>
                <InpDate value={newAirDate} onChange={setNewAirDate}/>
                <Btn variant="warn" onClick={()=>{
                  if(!newAirDate) return;
                  sf({air_dates:[...(f.air_dates||[]),newAirDate].sort()});setNewAirDate("");
                }}>+ Эфир</Btn>
              </div>
            </Field>
          )}
        </div>
      </div>

      <div style={{display:"flex",justifyContent:"space-between",marginTop:20,borderTop:"1px solid #334155",paddingTop:16}}>
        <div>{!isNew&&<Btn variant="danger" onClick={()=>onDelete(project.id)}>Удалить проект</Btn>}</div>
        <div style={{display:"flex",gap:8}}>
          <Btn variant="ghost" onClick={onClose}>Отмена</Btn>
          <Btn variant="primary" onClick={()=>{if(!f.name.trim()){alert("Введите название");return;}onSave(f);}}>
            {isNew?"Создать проект":"Сохранить"}
          </Btn>
        </div>
      </div>
    </Modal>
  );
}

// ── КАЛЕНДАРЬ ────────────────────────────────────────────────────────
function CalendarView({data}){
  const today=new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  const [selectedDay,setSelectedDay]=useState(null);

  function prevMonth(){if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);}
  function nextMonth(){if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);}

  // Генерируем все дни месяца с привязкой к неделям (Пн=первый)
  const firstDay=new Date(year,month,1);
  const startOffset=(firstDay.getDay()+6)%7; // 0=Пн
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);

  // Все эфирные даты
  const allAirDates={};
  data.projects.forEach(proj=>{
    generateAirDates(proj).forEach(d=>{
      if(!allAirDates[d]) allAirDates[d]=[];
      allAirDates[d].push(proj);
    });
  });
  // preOTK и OTK
  const milestones={};
  data.projects.forEach(proj=>{
    if(proj.pre_otk){
      if(!milestones[proj.pre_otk]) milestones[proj.pre_otk]=[];
      milestones[proj.pre_otk].push({type:"preotk",proj});
    }
    if(proj.otk){
      if(!milestones[proj.otk]) milestones[proj.otk]=[];
      milestones[proj.otk].push({type:"otk",proj});
    }
  });

  function dayStr(d){
    if(!d) return null;
    return `${String(d).padStart(2,"0")}.${String(month+1).padStart(2,"0")}.${year}`;
  }

  const todayStr=formatDate(today);

  // День-детальная панель
  const selStr=selectedDay?dayStr(selectedDay):null;
  const selTasks=selStr?data.tasks.filter(t=>t.day===selStr):[];
  const selAirs=selStr?(allAirDates[selStr]||[]):[];
  const selMil=selStr?(milestones[selStr]||[]):[];

  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:20,alignItems:"start"}}>
      <div>
        {/* Навигация */}
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
          <Btn variant="ghost" onClick={prevMonth}>←</Btn>
          <span style={{fontSize:16,fontWeight:700,minWidth:160,textAlign:"center"}}>
            {MONTHS[month]} {year}
          </span>
          <Btn variant="ghost" onClick={nextMonth}>→</Btn>
          <Btn variant="ghost" small onClick={()=>{setYear(today.getFullYear());setMonth(today.getMonth());}}>Сегодня</Btn>
        </div>

        {/* Заголовки дней */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:2}}>
          {["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(d=>(
            <div key={d} style={{textAlign:"center",fontSize:11,color:"#475569",padding:"4px 0"}}>{d}</div>
          ))}
        </div>

        {/* Сетка дней */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
          {cells.map((d,i)=>{
            const ds=dayStr(d);
            const isToday=ds===todayStr;
            const isSel=d&&selectedDay===d;
            const dayTasks=ds?data.tasks.filter(t=>t.day===ds):[];
            const dayAirs=ds?(allAirDates[ds]||[]):[];
            const dayMil=ds?(milestones[ds]||[]):[];
            const projsWithTasks=[...new Set(dayTasks.map(t=>t.project))];
            return (
              <div key={i} onClick={()=>d&&setSelectedDay(isSel?null:d)}
                style={{minHeight:80,background:isSel?"#1e3a5f":isToday?"rgba(59,130,246,0.1)":"#1e293b",
                  border:`1px solid ${isSel?"#3b82f6":isToday?"rgba(59,130,246,0.4)":"#263352"}`,
                  borderRadius:6,padding:4,cursor:d?"pointer":"default",
                  opacity:d?1:0.2}}>
                {d&&(
                  <>
                    <div style={{fontSize:11,color:isToday?"#3b82f6":"#475569",fontWeight:isToday?700:400,marginBottom:3}}>
                      {d}
                    </div>
                    {/* Цветные точки проектов */}
                    <div style={{display:"flex",flexWrap:"wrap",gap:2,marginBottom:2}}>
                      {projsWithTasks.map(pid=>{
                        const proj=data.projects.find(p=>p.id===pid);
                        return <div key={pid} title={proj?.name} style={{width:6,height:6,borderRadius:"50%",background:proj?.color||"#64748b"}}/>;
                      })}
                    </div>
                    {/* Эфиры */}
                    {dayAirs.map(proj=>(
                      <div key={proj.id} style={{fontSize:9,color:"#f59e0b",background:"rgba(245,158,11,0.15)",
                        borderRadius:2,padding:"1px 3px",marginBottom:1,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>
                        📺 {proj.name}
                      </div>
                    ))}
                    {/* Вехи */}
                    {dayMil.map((m,mi)=>(
                      <div key={mi} style={{fontSize:9,
                        color:m.type==="otk"?"#22c55e":"#3b82f6",
                        background:m.type==="otk"?"rgba(34,197,94,0.15)":"rgba(59,130,246,0.15)",
                        borderRadius:2,padding:"1px 3px",marginBottom:1,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>
                        {m.type==="otk"?"✓ОТК":"↑пОТК"} {m.proj.name}
                      </div>
                    ))}
                    {dayTasks.length>0&&(
                      <div style={{fontSize:9,color:"#475569",marginTop:1}}>{dayTasks.length} смен</div>
                    )}
                  </>
                )}
              </div>
            );
          })}
        </div>

        {/* Легенда */}
        <div style={{marginTop:12,display:"flex",gap:16,flexWrap:"wrap"}}>
          {data.projects.map(p=>(
            <div key={p.id} style={{display:"flex",alignItems:"center",gap:4}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:p.color}}/>
              <span style={{fontSize:10,color:"#475569"}}>{p.name}</span>
            </div>
          ))}
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <span style={{fontSize:10,color:"#f59e0b"}}>📺</span><span style={{fontSize:10,color:"#475569"}}>эфир</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <span style={{fontSize:10,color:"#22c55e"}}>✓ОТК</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <span style={{fontSize:10,color:"#3b82f6"}}>↑Пред-ОТК</span>
          </div>
        </div>
      </div>

      {/* Боковая панель дня */}
      {selStr&&(
        <div style={{width:280,background:"#1e293b",border:"1px solid #334155",borderRadius:10,
          padding:"14px 16px",position:"sticky",top:0}}>
          <div style={{fontWeight:700,fontSize:14,color:"#93c5fd",marginBottom:12}}>
            {dayLabel(selStr)}
          </div>
          {selAirs.map(proj=>(
            <div key={proj.id} style={{background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.3)",
              borderRadius:6,padding:"6px 10px",marginBottom:6}}>
              <span style={{fontSize:11,color:"#f59e0b"}}>📺 Эфир: {proj.name}</span>
              {proj.air_time&&<span style={{fontSize:10,color:"#64748b",marginLeft:6}}>{proj.air_time}</span>}
            </div>
          ))}
          {selMil.map((m,i)=>(
            <div key={i} style={{background:m.type==="otk"?"rgba(34,197,94,0.1)":"rgba(59,130,246,0.1)",
              border:`1px solid ${m.type==="otk"?"rgba(34,197,94,0.3)":"rgba(59,130,246,0.3)"}`,
              borderRadius:6,padding:"6px 10px",marginBottom:6}}>
              <span style={{fontSize:11,color:m.type==="otk"?"#22c55e":"#3b82f6"}}>
                {m.type==="otk"?"✓ ОТК":"↑ Пред-ОТК"}: {m.proj.name}
              </span>
            </div>
          ))}
          {selTasks.length===0&&selAirs.length===0&&selMil.length===0&&(
            <div style={{color:"#334155",fontSize:12}}>Нет событий</div>
          )}
          {[...new Set(selTasks.map(t=>t.person))].map(person=>(
            <div key={person} style={{marginBottom:10}}>
              <div style={{fontSize:10,color:"#475569",letterSpacing:1,marginBottom:4}}>{person.toUpperCase()}</div>
              {selTasks.filter(t=>t.person===person).map(t=>(
                <TaskCard key={t.id} task={t} projects={data.projects}/>
              ))}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── ГАНТ + ФОРМА ЗАДАЧИ ──────────────────────────────────────────────
function GanttView({data,onUpdate}){
  const [weekOffset,setWeekOffset]=useState(0);
  const [taskModal,setTaskModal]=useState(null);

  // Вычисляем диапазон дат (4 недели от текущего понедельника + offset)
  const refMonday=useMemo(()=>{
    const d=new Date(); const day=d.getDay()||7;
    d.setDate(d.getDate()-day+1+weekOffset*7);
    d.setHours(0,0,0,0); return d;
  },[weekOffset]);

  const days=useMemo(()=>{
    const arr=[];
    for(let i=0;i<28;i++){
      const d=new Date(refMonday); d.setDate(refMonday.getDate()+i);
      arr.push(formatDate(d));
    }
    return arr;
  },[refMonday]);

  const todayStr=formatDate(new Date());

  // Строки Ганта: уникальные project+series из задач + series из проектов
  const rows=useMemo(()=>{
    const seen=new Set();
    const result=[];
    data.projects.forEach(proj=>{
      const projSeries=[...(proj.series||[]),...data.tasks.filter(t=>t.project===proj.id).map(t=>t.series)];
      [...new Set(projSeries)].sort().forEach(series=>{
        const key=proj.id+"|"+series;
        if(!seen.has(key)){seen.add(key);result.push({projId:proj.id,series,proj});}
      });
    });
    return result;
  },[data]);

  function saveTask(task){
    let tasks;
    if(task._cascadeAll){
      const clean={...task}; delete clean._cascadeAll;
      tasks=task._cascadeAll.map(t=>t.id===clean.id?clean:t);
      if(!tasks.find(t=>t.id===clean.id)) tasks.push({...clean,id:genId(data.tasks)});
    } else {
      tasks=[...data.tasks];
      if(task.id&&tasks.find(t=>t.id===task.id)) tasks=tasks.map(t=>t.id===task.id?task:t);
      else tasks.push({...task,id:genId(data.tasks)});
    }
    onUpdate("tasks",tasks); setTaskModal(null);
  }
  function deleteTask(id){
    onUpdate("tasks",data.tasks.filter(t=>t.id!==id)); setTaskModal(null);
  }

  const COL=52; // ширина колонки дня в px

  return (
    <div>
      {/* Тулбар */}
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:16,flexWrap:"wrap"}}>
        <Btn variant="ghost" onClick={()=>setWeekOffset(w=>w-1)}>← Пред. неделя</Btn>
        <Btn variant="ghost" small onClick={()=>setWeekOffset(0)}>Сегодня</Btn>
        <Btn variant="ghost" onClick={()=>setWeekOffset(w=>w+1)}>След. неделя →</Btn>
        <div style={{flex:1}}/>
        <Btn variant="primary" onClick={()=>setTaskModal({})}>+ Задача</Btn>
        <Btn variant="danger" onClick={()=>setTaskModal({unplanned:true})}>⚠ Внеплан</Btn>
      </div>

      {/* Сетка */}
      <div style={{overflowX:"auto"}}>
        <div style={{display:"flex",minWidth:200+COL*28}}>
          {/* Левая колонка */}
          <div style={{width:200,flexShrink:0}}>
            {/* Пустая шапка */}
            <div style={{height:44,borderBottom:"1px solid #334155",
              borderRight:"1px solid #334155",background:"#0f172a"}}/>
            {rows.map((row,ri)=>(
              <div key={ri} style={{height:52,display:"flex",alignItems:"center",
                padding:"0 10px",borderBottom:"1px solid #1e293b",
                borderRight:"1px solid #334155",background:ri%2===0?"#0f172a":"#0a1220"}}>
                <div style={{width:8,height:8,borderRadius:2,background:row.proj.color,flexShrink:0,marginRight:6}}/>
                <div style={{overflow:"hidden"}}>
                  <div style={{fontSize:10,color:"#475569",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                    {row.proj.name}
                  </div>
                  <div style={{fontSize:12,fontWeight:600,color:"#cbd5e1"}}>{row.series}</div>
                </div>
              </div>
            ))}
          </div>

          {/* Правая часть: дни */}
          <div style={{flex:1}}>
            {/* Шапка дней */}
            <div style={{display:"flex",height:44,borderBottom:"1px solid #334155"}}>
              {days.map(d=>{
                const pd=parseDate(d);
                const isToday=d===todayStr;
                const isSun=pd&&pd.getDay()===0;
                const isMon=pd&&pd.getDay()===1;
                return (
                  <div key={d} style={{width:COL,flexShrink:0,display:"flex",flexDirection:"column",
                    alignItems:"center",justifyContent:"center",
                    background:isToday?"rgba(59,130,246,0.2)":isSun||isMon?"#1e293b":"#0f172a",
                    borderLeft:isMon?"2px solid #334155":"1px solid #1e293b",
                    borderBottom:"1px solid #334155"}}>
                    <span style={{fontSize:9,color:"#475569"}}>{WDAYS[pd?.getDay()||0]}</span>
                    <span style={{fontSize:11,fontWeight:isToday?700:400,color:isToday?"#60a5fa":"#64748b"}}>
                      {pd?pd.getDate():""}
                    </span>
                  </div>
                );
              })}
            </div>

            {/* Строки */}
            {rows.map((row,ri)=>(
              <div key={ri} style={{display:"flex",height:52,background:ri%2===0?"#0a1220":"#060d1a"}}>
                {days.map(d=>{
                  const cellTasks=data.tasks.filter(t=>t.project===row.projId&&t.series===row.series&&t.day===d);
                  const isToday=d===todayStr;
                  const pd=parseDate(d);
                  const isMon=pd&&pd.getDay()===1;
                  return (
                    <div key={d} onClick={()=>setTaskModal({project:row.projId,series:row.series,day:d})}
                      style={{width:COL,flexShrink:0,borderLeft:isMon?"2px solid #334155":"1px solid #1e293b",
                        padding:2,display:"flex",flexDirection:"column",gap:1,cursor:"pointer",
                        background:isToday?"rgba(59,130,246,0.06)":"transparent",
                        transition:"background 0.1s"}}
                      onMouseEnter={e=>e.currentTarget.style.background=isToday?"rgba(59,130,246,0.12)":"rgba(255,255,255,0.03)"}
                      onMouseLeave={e=>e.currentTarget.style.background=isToday?"rgba(59,130,246,0.06)":"transparent"}>
                      {cellTasks.map(t=>{
                        const st=STATUSES[t.status];
                        return (
                          <div key={t.id} onClick={e=>{e.stopPropagation();setTaskModal(t);}}
                            title={`${t.person} ${t.from}:00–${t.to}:00 ${t.note||""}`}
                            style={{background:st?st.bg:"rgba(255,255,255,0.08)",
                              border:`1px solid ${st?st.color+"44":"#334155"}`,
                              borderRadius:3,padding:"1px 3px",fontSize:9,
                              color:st?st.color:"#94a3b8",overflow:"hidden",
                              whiteSpace:"nowrap",textOverflow:"ellipsis",
                              cursor:"pointer"}}>
                            {t.unplanned&&"⚠"}{st?.label||t.status} {t.person}
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        </div>
      </div>

      {taskModal!==null&&(
        <TaskModal task={taskModal} data={data}
          onSave={saveTask} onDelete={deleteTask} onClose={()=>setTaskModal(null)}/>
      )}
    </div>
  );
}

function TaskModal({task,data,onSave,onDelete,onClose}){
  const isNew=!task.id;
  const [form,setForm]=useState({
    project:task.project||"",series:task.series||"",status:task.status||"",
    person:task.person||"",day:task.day||"",from:task.from||10,to:task.to||19,
    note:task.note||"",unplanned:task.unplanned||false,shifts_tail:false,
  });
  const sf=v=>setForm(f=>({...f,...v}));

  const availSeries=useMemo(()=>{
    const proj=data.projects.find(p=>p.id===form.project);
    const fromProj=proj?.series||[];
    const fromTasks=[...new Set(data.tasks.filter(t=>t.project===form.project).map(t=>t.series))];
    return [...new Set([...fromProj,...fromTasks])].sort();
  },[form.project,data]);

  const availPeople=useMemo(()=>{
    if(!form.status) return data.people.filter(p=>p.active!==false);
    return filterPeopleByStatus(data.people,form.status);
  },[form.status,data.people]);

  const roleHint=useMemo(()=>{
    const roles=STATUS_ROLES[form.status];
    if(!roles||!roles.length) return "";
    const labels=roles.map(r=>data.roles.find(rl=>rl.id===r)?.label||r);
    return `Показаны: ${labels.join(", ")}`;
  },[form.status,data.roles]);

  // Каскадный сдвиг — проверяем есть ли следующие задачи серии
  const hasTail=useMemo(()=>{
    if(!task.id||!task.day||form.day===task.day) return false;
    return data.tasks.some(t=>t.project===task.project&&t.series===task.series&&t.day>task.day&&t.id!==task.id);
  },[form.day,task,data.tasks]);

  return (
    <Modal title={isNew?(form.unplanned?"⚠ Внеплановая задача":"Новая задача"):"Редактировать задачу"} onClose={onClose}>
      {form.unplanned&&(
        <div style={{background:"rgba(249,115,22,0.1)",border:"1px solid rgba(249,115,22,0.3)",
          borderRadius:6,padding:"8px 12px",marginBottom:12,fontSize:12,color:"#fb923c"}}>
          ⚠ Внеплановая задача — будет отмечена в отчётах отдельно
        </div>
      )}
      <Field label="Проект">
        <Sel value={form.project} onChange={v=>sf({project:v,series:"",person:""})}
          options={data.projects.map(p=>({value:p.id,label:p.name}))} placeholder="Выбрать проект..."/>
      </Field>
      <Field label="Серия">
        <div style={{display:"flex",gap:6}}>
          <Sel value={form.series} onChange={v=>sf({series:v})}
            options={availSeries} placeholder="Выбрать серию..." style={{flex:1}}/>
          <Inp value={form.series} onChange={v=>sf({series:v})}
            placeholder="или ввести: С01" style={{flex:1}}/>
        </div>
      </Field>
      <Field label="Этап">
        <Sel value={form.status} onChange={v=>sf({status:v,person:""})}
          options={STATUS_ORDER} placeholder="Выбрать этап..."/>
      </Field>
      <Field label="Исполнитель" hint={roleHint}>
        <Sel value={form.person} onChange={v=>sf({person:v})}
          options={availPeople.map(p=>({value:p.name,label:p.name+(p.roles.length?" ("+p.roles.map(r=>data.roles.find(rl=>rl.id===r)?.label||r).join(", ")+")":"")}))}
          placeholder="Выбрать исполнителя..."/>
      </Field>
      <Field label="Дата">
        <InpDate value={form.day} onChange={v=>sf({day:v})}/>
      </Field>
      <Field label="Время">
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
          {TIME_PRESETS.map(({f:fr,t:to})=>(
            <Btn key={`${fr}-${to}`} small
              variant={form.from===fr&&form.to===to?"primary":"ghost"}
              onClick={()=>sf({from:fr,to})}>
              {fr}–{to}
            </Btn>
          ))}
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <span style={{fontSize:12,color:"#64748b"}}>с</span>
          <Inp value={String(form.from)} onChange={v=>sf({from:parseInt(v)||0})}
            type="number" min="0" max="24" style={{width:60}}/>
          <span style={{fontSize:12,color:"#64748b"}}>до</span>
          <Inp value={String(form.to)} onChange={v=>sf({to:parseInt(v)||0})}
            type="number" min="0" max="24" style={{width:60}}/>
          <span style={{fontSize:12,color:"#64748b"}}>{form.to-form.from>0?`${form.to-form.from}ч`:""}</span>
        </div>
      </Field>
      <Field label="Заметка">
        <textarea value={form.note} onChange={e=>sf({note:e.target.value})} rows={2}
          placeholder="Описание, факт выполнения..."
          style={{background:"#0f172a",border:"1px solid #334155",color:"#e2e8f0",
            borderRadius:6,padding:"7px 10px",fontSize:13,width:"100%",resize:"vertical"}}/>
      </Field>
      <div style={{display:"flex",gap:16,marginBottom:6}}>
        <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
          <input type="checkbox" checked={form.unplanned}
            onChange={e=>sf({unplanned:e.target.checked})} style={{accentColor:"#f97316"}}/>
          <span style={{fontSize:13,color:"#f97316"}}>⚠ Внеплановая</span>
        </label>
        {hasTail&&(
          <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
            <input type="checkbox" checked={form.shifts_tail}
              onChange={e=>sf({shifts_tail:e.target.checked})} style={{accentColor:"#f59e0b"}}/>
            <span style={{fontSize:13,color:"#f59e0b"}}>Сдвинуть весь хвост серии</span>
          </label>
        )}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:16}}>
        <div>{!isNew&&<Btn variant="danger" onClick={()=>onDelete(task.id)}>Удалить</Btn>}</div>
        <div style={{display:"flex",gap:8}}>
          <Btn variant="ghost" onClick={onClose}>Отмена</Btn>
          <Btn variant="primary" onClick={()=>{
            if(!form.project){alert("Выберите проект");return;}
            if(!form.series){alert("Укажите серию");return;}
            if(!form.status){alert("Выберите этап");return;}
            if(!form.person){alert("Выберите исполнителя");return;}
            if(!form.day){alert("Укажите дату");return;}
            // Каскадный сдвиг
            if(form.shifts_tail&&task.id&&form.day!==task.day){
              const diff=(parseDate(form.day)-parseDate(task.day))/(1000*60*60*24);
              const tailTasks=data.tasks.filter(t=>t.project===task.project&&t.series===task.series&&t.day>task.day&&t.id!==task.id);
              const updatedTail=tailTasks.map(t=>({...t,day:addDays(t.day,diff)}));
              const allTasks=data.tasks.map(t=>{
                const upd=updatedTail.find(u=>u.id===t.id);
                return upd||t;
              });
              onSave({...task,...form,_cascadeAll:allTasks});
            } else {
              onSave({...task,...form});
            }
          }}>
            {isNew?"Создать задачу":"Сохранить"}
          </Btn>
        </div>
      </div>
    </Modal>
  );
}

// ── ПО ДНЯМ ──────────────────────────────────────────────────────────
function DaysView({data,conflictIds}){
  const [groupBy,setGroupBy]=useState("day");
  const [filterPerson,setFilterPerson]=useState("");
  const [filterProject,setFilterProject]=useState("");
  const tasks=useMemo(()=>enrichTasks(data.tasks),[data.tasks]);
  const people=useMemo(()=>[...new Set(tasks.map(t=>t.person))].sort(),[tasks]);

  const filtered=useMemo(()=>{
    let r=tasks;
    if(filterPerson) r=r.filter(t=>t.person===filterPerson);
    if(filterProject) r=r.filter(t=>t.project===filterProject);
    return r;
  },[tasks,filterPerson,filterProject]);

  const peopleCols=filterPerson?[filterPerson]:people;

  function DayCol({dayKey,dayTasks,compact}){
    const hasC=dayTasks.some(t=>conflictIds.has(t.id));
    return (
      <div>
        <div style={{padding:compact?"4px 6px":"7px 10px",
          background:hasC?"rgba(239,68,68,0.12)":"#1e293b",
          borderRadius:"6px 6px 0 0",borderBottom:`2px solid ${hasC?"#ef4444":"#3b82f6"}`,
          fontSize:compact?10:11,fontWeight:700,color:hasC?"#f87171":"#93c5fd",
          display:"flex",justifyContent:"space-between"}}>
          <span>{dayLabel(dayKey)}</span>{hasC&&<span>⚡</span>}
        </div>
        <div style={{background:"#1e293b",borderRadius:"0 0 6px 6px",border:"1px solid #334155",
          borderTop:"none",padding:compact?4:6,minHeight:compact?50:80}}>
          {peopleCols.map(person=>{
            const pt=dayTasks.filter(t=>t.person===person);
            if(!pt.length) return null;
            return (
              <div key={person} style={{marginBottom:compact?4:6}}>
                <div style={{fontSize:compact?8:9,color:"#475569",letterSpacing:1,marginBottom:2}}>{person.toUpperCase()}</div>
                {pt.map(t=><TaskCard key={t.id} task={t} projects={data.projects} isConflict={conflictIds.has(t.id)}/>)}
              </div>
            );
          })}
          {!dayTasks.length&&<div style={{color:"#334155",fontSize:11}}>нет задач</div>}
        </div>
      </div>
    );
  }

  const dayKeys=[...new Set(filtered.map(t=>t._dayKey))].sort();
  const groups={};
  if(groupBy!=="day") filtered.forEach(t=>{
    const k=groupBy==="week"?t._weekKey:t._monthKey;
    if(!groups[k]) groups[k]=[];
    groups[k].push(t);
  });

  return (
    <div>
      {/* Фильтры */}
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
        {["все",...people].map(p=>(
          <button key={p} onClick={()=>setFilterPerson(p==="все"?"":p)}
            style={{padding:"3px 12px",borderRadius:16,border:"1px solid",cursor:"pointer",fontSize:11,
              borderColor:(!filterPerson&&p==="все")||(filterPerson===p)?"#3b82f6":"#334155",
              background:(!filterPerson&&p==="все")||(filterPerson===p)?"rgba(59,130,246,0.2)":"transparent",
              color:(!filterPerson&&p==="все")||(filterPerson===p)?"#93c5fd":"#64748b"}}>
            {p}
          </button>
        ))}
        <span style={{color:"#263352",margin:"0 4px"}}>│</span>
        {["все проекты",...data.projects.map(p=>p.id)].map(pid=>{
          const proj=data.projects.find(p=>p.id===pid);
          const label=proj?proj.name:"все проекты";
          const active=pid==="все проекты"?!filterProject:filterProject===pid;
          return (
            <button key={pid} onClick={()=>setFilterProject(pid==="все проекты"?"":pid)}
              style={{padding:"3px 12px",borderRadius:16,border:"1px solid",cursor:"pointer",fontSize:11,
                borderColor:active?(proj?.color||"#3b82f6"):"#334155",
                background:active?`${proj?.color||"#3b82f6"}22`:"transparent",
                color:active?(proj?.color||"#93c5fd"):"#64748b"}}>
              {label}
            </button>
          );
        })}
        <span style={{color:"#263352",margin:"0 4px"}}>│</span>
        {[["day","Дни"],["week","Недели"],["month","Месяцы"]].map(([v,l])=>(
          <button key={v} onClick={()=>setGroupBy(v)}
            style={{padding:"3px 10px",borderRadius:4,border:"1px solid",cursor:"pointer",fontSize:10,
              borderColor:groupBy===v?"#475569":"#263352",background:groupBy===v?"#334155":"transparent",
              color:groupBy===v?"#cbd5e1":"#475569"}}>{l}</button>
        ))}
      </div>

      {groupBy==="day"?(
        <div style={{display:"grid",gridTemplateColumns:`repeat(${Math.min(dayKeys.length,7)},1fr)`,gap:8}}>
          {dayKeys.map(dk=><DayCol key={dk} dayKey={dk} dayTasks={filtered.filter(t=>t._dayKey===dk)}/>)}
        </div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:20}}>
          {Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).map(([gk,gTasks])=>{
            const sample=gTasks[0];
            const title=groupBy==="week"?`Неделя ${weekLabel(sample.day)}`:`${MONTHS[parseInt(gk.split("-")[1])-1]} ${gk.split("-")[0]}`;
            const dks=[...new Set(gTasks.map(t=>t._dayKey))].sort();
            return (
              <div key={gk}>
                <div style={{fontSize:13,fontWeight:700,color:"#93c5fd",marginBottom:8,
                  paddingBottom:6,borderBottom:"1px solid #1e293b",display:"flex",justifyContent:"space-between"}}>
                  <span>{title}</span>
                  <span style={{fontWeight:400,fontSize:11,color:"#475569"}}>{gTasks.length} смен</span>
                </div>
                <div style={{display:"grid",gridTemplateColumns:`repeat(${Math.min(dks.length,7)},1fr)`,gap:6}}>
                  {dks.map(dk=><DayCol key={dk} dayKey={dk} dayTasks={gTasks.filter(t=>t._dayKey===dk)} compact/>)}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── ПО ЛЮДЯМ ─────────────────────────────────────────────────────────

  const people=useMemo(()=>[...new Set(tasks.map(t=>t.person))].sort(),[tasks]);

  const baseTasks=useMemo(()=>{
    let r=tasks;
    if(filterProject) r=r.filter(t=>t.project===filterProject);

  return (

          <button key={p} onClick={()=>setFilterPerson(p==="все"?"":p)}
            style={{padding:"3px 12px",borderRadius:16,border:"1px solid",cursor:"pointer",fontSize:11,
              borderColor:(!filterPerson&&p==="все")||(filterPerson===p)?"#3b82f6":"#334155",
              background:(!filterPerson&&p==="все")||(filterPerson===p)?"rgba(59,130,246,0.2)":"transparent",

            {p}{tasks.some(t=>t.person===p&&conflictIds.has(t.id))&&
              <span style={{width:5,height:5,borderRadius:"50%",background:"#ef4444",display:"inline-block",marginLeft:4}}/>}
          </button>
        ))}
        <span style={{color:"#263352",margin:"0 4px"}}>│</span>
        {[["day","Дни"],["week","Нед"],["month","Мес"]].map(([v,l])=>(
          <button key={v} onClick={()=>setGroupBy(v)}
            style={{padding:"3px 10px",borderRadius:4,border:"1px solid",cursor:"pointer",fontSize:10,
              borderColor:groupBy===v?"#475569":"#263352",background:groupBy===v?"#334155":"transparent",
              color:groupBy===v?"#cbd5e1":"#475569"}}>{l}</button>
        ))}
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:20}}>
        {showPeople.map(person=>{
          const pTasks=baseTasks.filter(t=>t.person===person);
          if(!pTasks.length) return null;
          const cDays=[...new Set(pTasks.filter(t=>conflictIds.has(t.id)).map(t=>t._dayKey))];
          const groups={};
          pTasks.forEach(t=>{
            const k=groupBy==="week"?t._weekKey:groupBy==="month"?t._monthKey:t._dayKey;
            if(!groups[k]) groups[k]=[];
            groups[k].push(t);
          });
          return (
            <div key={person}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <div style={{width:32,height:32,borderRadius:"50%",background:"#1e293b",
                  border:"2px solid #3b82f6",display:"flex",alignItems:"center",
                  justifyContent:"center",fontSize:13,fontWeight:700,color:"#3b82f6"}}>
                  {person[0]}
                </div>
                <span style={{fontSize:15,fontWeight:700}}>{person}</span>
                {cDays.length>0&&(
                  <span style={{background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.4)",
                    borderRadius:12,padding:"2px 10px",fontSize:11,color:"#f87171"}}>
                    ⚡ конфликты: {cDays.map(d=>dayLabel(d)).join(", ")}
                  </span>
                )}
              </div>
              <div style={{display:"grid",
                gridTemplateColumns:`repeat(${Math.min(Object.keys(groups).length,7)},1fr)`,gap:6}}>
                {Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).map(([gk,gtasks])=>{
                  const hasC=gtasks.some(t=>conflictIds.has(t.id));
                  const label=groupBy==="day"?dayLabel(gk):groupBy==="week"?`Нед ${weekLabel(gtasks[0].day)}`:`${MONTHS[parseInt(gk.split("-")[1])-1]}`;
                  return (
                    <div key={gk} style={{background:hasC?"rgba(239,68,68,0.05)":"#1e293b",
                      border:`1px solid ${hasC?"rgba(239,68,68,0.35)":"#334155"}`,
                      borderRadius:8,padding:"8px 10px",minHeight:60}}>
                      <div style={{fontSize:9,color:hasC?"#f87171":"#475569",marginBottom:5,letterSpacing:0.5}}>
                        {label}{hasC&&" ⚡"}
                      </div>
                      {gtasks.map(t=><TaskCard key={t.id} task={t} projects={data.projects} isConflict={conflictIds.has(t.id)}/>)}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── КОНФЛИКТЫ ────────────────────────────────────────────────────────
function ConflictsView({details,data}){
  if(!details.length) return (
    <div style={{textAlign:"center",padding:"60px 20px",color:"#475569"}}>
      <div style={{fontSize:40,marginBottom:12}}>✓</div>
      <div style={{fontSize:16,fontWeight:700,color:"#94a3b8"}}>Конфликтов нет</div>
      <div style={{fontSize:13,marginTop:6}}>Все смены расставлены корректно</div>
    </div>
  );
  const byDay={};
  details.forEach(c=>{if(!byDay[c.dayStr]) byDay[c.dayStr]=[];byDay[c.dayStr].push(c);});
  return (
    <div>
      <div style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",
        borderRadius:8,padding:"10px 16px",marginBottom:20,display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:20}}>⚡</span>
        <div>
          <span style={{fontWeight:700,color:"#f87171",fontSize:14}}>Конфликтов: {details.length}</span>
          <span style={{color:"#64748b",fontSize:12,marginLeft:10}}>один человек — несколько задач в пересекающееся время</span>
        </div>
      </div>
      {Object.entries(byDay).sort(([a],[b])=>a.localeCompare(b)).map(([day,pairs])=>(
        <div key={day} style={{marginBottom:20}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <span style={{fontSize:12,fontWeight:700,color:"#f87171"}}>{dayLabel(day)}</span>
            <div style={{flex:1,height:1,background:"rgba(239,68,68,0.2)"}}/>
          </div>
          {pairs.map((p,i)=>{
            const colorA=projColor(data.projects,p.taskA.project);
            const colorB=projColor(data.projects,p.taskB.project);
            const minT=8,maxT=22,range=maxT-minT;
            const pct=v=>`${((v-minT)/range)*100}%`;
            return (
              <div key={i} style={{background:"#1e293b",border:"1px solid rgba(239,68,68,0.3)",
                borderRadius:8,padding:"12px 16px",marginBottom:10}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                  <div style={{width:26,height:26,borderRadius:6,background:"#0f172a",
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontWeight:800,fontSize:12,color:"#ef4444",border:"1px solid rgba(239,68,68,0.4)"}}>
                    {p.person[0]}
                  </div>
                  <span style={{fontWeight:700,fontSize:13}}>{p.person}</span>
                  <span style={{color:"#64748b",fontSize:11}}>
                    — пересечение {p.overlapFrom}:00–{p.overlapTo}:00 ({p.overlapTo-p.overlapFrom}ч)
                  </span>
                </div>
                <div style={{position:"relative",height:46,marginBottom:10}}>
                  {[8,10,12,14,16,18,20,22].map(h=>(
                    <div key={h} style={{position:"absolute",left:pct(h),top:0,bottom:0,
                      borderLeft:"1px solid #1e293b",pointerEvents:"none"}}>
                      <span style={{position:"absolute",bottom:0,fontSize:8,color:"#334155",paddingLeft:2}}>{h}</span>
                    </div>
                  ))}
                  {[{t:p.taskA,c:colorA,top:4},{t:p.taskB,c:colorB,top:24}].map(({t,c,top})=>(
                    <div key={t.id} style={{position:"absolute",
                      left:pct(t.from||0),width:`${((t.to-t.from)/range)*100}%`,
                      top,height:16,background:c,borderRadius:3,opacity:0.9,
                      display:"flex",alignItems:"center",paddingLeft:4,overflow:"hidden"}}>
                      <span style={{fontSize:8,color:"#fff",fontWeight:700,whiteSpace:"nowrap"}}>
                        {projName(data.projects,t.project)} {t.series}
                      </span>
                    </div>
                  ))}
                  <div style={{position:"absolute",left:pct(p.overlapFrom),
                    width:`${((p.overlapTo-p.overlapFrom)/range)*100}%`,
                    top:0,height:46,background:"rgba(239,68,68,0.12)",
                    border:"1px solid rgba(239,68,68,0.35)",borderRadius:3}}/>
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// ── APP ──────────────────────────────────────────────────────────────
function App(){
  const [data,setData]=useState(null);
  const [view,setView]=useState("projects");
  const [syncState,setSyncState]=useState("ok"); // "ok" | "saving" | "error"
  const saveTimer=useRef(null);

  useEffect(()=>{
    setSyncState("saving");
    cloudLoad()
      .then(record=>{
        // Если бин пустой — заливаем демо-данные
        const isEmpty=!record||!record.roles||!record.roles.length;
        if(isEmpty){
          const demo=makeDemoData();
          setData(demo);
          return cloudSave(demo);
        }
        setData(record);
      })
      .then(()=>setSyncState("ok"))
      .catch(()=>{
        // Нет сети — работаем с демо локально
        setData(makeDemoData());
        setSyncState("error");
      });
  },[]);

  function updateData(key,val){
    setData(d=>{
      const newData={...d,[key]:val};
      // Дебаунс — сохраняем через 1 сек после последнего изменения
      clearTimeout(saveTimer.current);
      setSyncState("saving");
      saveTimer.current=setTimeout(()=>{
        cloudSave(newData)
          .then(()=>setSyncState("ok"))
          .catch(()=>setSyncState("error"));
      },1000);
      return newData;
    });
  }

  const {ids:conflictIds,details:conflictDetails}=useMemo(()=>
    data?getConflicts(data.tasks):{ids:new Set(),details:[]},[data?.tasks]);
  const conflictCount=conflictDetails.length;

  if(!data) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#475569"}}>
      Загрузка...
    </div>
  );

  const TABS=[
    {id:"projects", label:"Проекты"},
    {id:"calendar", label:"Календарь"},
    {id:"gantt",    label:"Гант"},
    {id:"days",     label:"По дням"},
    {id:"people",   label:"По людям"},
    {id:"conflicts",label:`Конфликты${conflictCount?` ⚡${conflictCount}`:""}`,warn:conflictCount>0},
    {id:"directory",label:"⚙ Справочник"},
  ];

  return (
    <div style={{background:"#0f172a",minHeight:"100vh",color:"#e2e8f0"}}>
      {/* Шапка */}
      <div style={{background:"#1e293b",borderBottom:"1px solid #334155",padding:"12px 20px",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div>
            <div style={{fontSize:10,color:"#64748b",letterSpacing:2,textTransform:"uppercase"}}>ББХ · Постпродакшн</div>
            <div style={{fontSize:18,fontWeight:700,color:"#fff",marginTop:1}}>Планирование студии</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {{ok:    <span style={{fontSize:11,color:"#22c55e"}}>✓ Сохранено</span>,
              saving:<span style={{fontSize:11,color:"#f59e0b"}}>⟳ Сохранение...</span>,
              error: <span style={{fontSize:11,color:"#ef4444"}}>⚠ Нет связи</span>,
            }[syncState]}
            <Btn variant="ghost" small onClick={()=>data&&exportJSON(data)}>↓ Экспорт</Btn>
            <Btn variant="danger" small onClick={()=>{
              if(window.confirm("Сбросить все данные к демо-набору? Нельзя отменить.")){
                const demo=makeDemoData();
                setData(demo);
                setSyncState("saving");
                cloudSave(demo).then(()=>setSyncState("ok")).catch(()=>setSyncState("error"));
              }
            }}>Сброс к демо</Btn>
          </div>
        </div>
        {/* Вкладки */}
        <div style={{display:"flex",gap:1,background:"#0f172a",borderRadius:8,border:"1px solid #334155",
          overflow:"hidden",width:"fit-content"}}>
          {TABS.map(({id,label,warn})=>(
            <button key={id} onClick={()=>setView(id)} style={{
              padding:"6px 14px",border:"none",borderRight:"1px solid #334155",cursor:"pointer",
              fontSize:12,fontFamily:"inherit",
              background:view===id?"#3b82f6":"transparent",
              color:warn?(view===id?"#fff":"#f87171"):(view===id?"#fff":"#64748b"),
              fontWeight:view===id?700:400}}>
              {label}
            </button>
          ))}
        </div>
      </div>

      {/* Контент */}
      <div style={{padding:"20px"}}>
        {view==="projects" &&<ProjectsView  data={data} onUpdate={updateData}/>}
        {view==="calendar" &&<CalendarView  data={data}/>}
        {view==="gantt"    &&<GanttView     data={data} onUpdate={updateData}/>}
        {view==="days"     &&<DaysView      data={data} conflictIds={conflictIds}/>}
        {view==="people"   &&<PeopleView    data={data} conflictIds={conflictIds}/>}
        {view==="conflicts"&&<ConflictsView details={conflictDetails} data={data}/>}
        {view==="directory"&&<DirectoryView data={data} onUpdate={updateData}/>}

        {/* Легенда статусов */}
        {!["conflicts","directory"].includes(view)&&(
          <div style={{marginTop:24,paddingTop:14,borderTop:"1px solid #1e293b",
            display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
            <span style={{fontSize:10,color:"#334155",letterSpacing:2}}>СТАТУСЫ:</span>
            {STATUS_ORDER.map(s=><StatusBadge key={s} s={s} small/>)}
            <span style={{fontSize:11,color:"#f87171",marginLeft:6}}>⚡ = конфликт</span>
            <span style={{fontSize:11,color:"#f97316",marginLeft:6}}>⚠ = внеплан</span>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
